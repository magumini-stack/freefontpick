# 폰트픽 운영 구성
#
#   서버에서:  docker compose up -d --build
#
# 재부팅 살아남기는 restart 정책이 맡는다(도커 서비스가 부팅 시 켜지면
# 컨테이너도 따라 올라온다). 별도 systemd 유닛을 만들지 않는 이유다.

services:
  app:
    build: .
    image: freefontpick:latest
    container_name: freefontpick
    restart: unless-stopped

    # 127.0.0.1 에만 묶는다. 바깥에서 8000 번으로 직접 들어올 수 없고
    # 오직 nginx 를 거쳐야 한다. 방화벽이 열려 있어도 안전하다.
    ports:
      - "127.0.0.1:8000:8000"

    # DB·업로드 폰트·생성 캐시. 컨테이너를 지우고 다시 만들어도 남는다.
    # 호스트 폴더의 소유자는 UID 1000 이어야 한다(이미지의 app 사용자).
    volumes:
      - /srv/freefontpick/user_data:/app/user_data

    # 비밀값이 들어 있어 저장소에 넣지 않는다. deploy/env.example 참고.
    env_file:
      - .env
    environment:
      # 이미지로 폰트 찾기 — 같은 compose 안의 finder 컨테이너로 넘긴다(app/routers/find.py)
      FINDER_URL: http://finder:8010

    # 현재 실사용 약 500MB. 새는 곳이 생겨도 서버 전체를 끌고 가지
    # 않도록 울타리를 둔다. 2GB 서버에서 1GB 면 넉넉하다.
    mem_limit: 700m     # 2026-09-23 실측 85MB(폰트 찾기는 finder 로 넘김) — finder 에 더 주려고 1g → 700m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 이미지로 폰트 찾기 엔진(OCR + 비교). 앱과 따로 두는 이유는 finder/Dockerfile 참고.
  # 처음 한 번은 폰트 목록을 만들어야 한다(앱이 떠 있는 상태에서):
  #   docker compose exec finder python build_catalog.py
  # 타닥타닥 폰트는 /srv/freefontpick/finder_data/tdtd 에 tdtd-webfont 의 out/fonts.json 과 out/full 을 올려 두면 같이 들어간다.
  finder:
    build: ./finder
    image: freefontpick-finder:latest
    container_name: freefontpick-finder
    restart: unless-stopped
    volumes:
      - /srv/freefontpick/finder_data:/data
    environment:
      FINDER_DATA: /data
      FINDER_APP_URL: http://app:8000
      FINDER_MAX_STACKS: "12"   # 메모리에 두는 글자 묶음 수 — 글자당 10MB 남짓, 한 줄이면 충분(디스크 캐시는 따로)
    # 실측 400~500MB(OCR 모델 + 폰트 목록 + 글자 묶음). 2GB 서버에서 앱 1GB 와 같이 두려면 여기가 한계다.
    # 2026-09-23 글자표를 set 으로 만들다 여기서 죽어 되풀이됐다 → 엔진이 비트 표(10MB)로 바꿈.
    # 2026-09-23 실측: 엔진 올린 뒤 370MB, 큰 이미지 OCR 때 순간 +300MB 쯤 → 700m 에서 한 번 죽었다(RestartCount 1). 1g 로.
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
