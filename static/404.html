<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지를 찾을 수 없습니다 — 폰트픽</title>
  <!-- 없는 주소이므로 색인 대상이 아니다. 상태 코드 404와 함께 나가지만
       robots 로도 한 번 더 못박아 둔다. -->
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#FAFAF7;--bg-card:#fff;--bg-secondary:#F3F3EF;
      --text-primary:#1A1A1A;--text-secondary:#6B6B6B;--text-muted:#9A9A9A;
      --border:rgba(0,0,0,.09);--border-hover:rgba(0,0,0,.18);
      --accent:#1E3A8A;--accent-light:#EEF2FB;--accent-hover:#16307A;
    }
    :root[data-theme="dark"]{
      --bg:#141414;--bg-card:#1E1E1E;--bg-secondary:#2A2A2A;
      --text-primary:#F0F0EC;--text-secondary:#A0A09A;--text-muted:#666660;
      --border:rgba(255,255,255,.1);--border-hover:rgba(255,255,255,.2);
      --accent:#5B82E0;--accent-light:#141A2A;--accent-hover:#7B9CE8;
    }
    @media (prefers-color-scheme:dark){
      :root:not([data-theme="light"]){
        --bg:#141414;--bg-card:#1E1E1E;--bg-secondary:#2A2A2A;
        --text-primary:#F0F0EC;--text-secondary:#A0A09A;--text-muted:#666660;
        --border:rgba(255,255,255,.1);--border-hover:rgba(255,255,255,.2);
        --accent:#5B82E0;--accent-light:#141A2A;--accent-hover:#7B9CE8;
      }
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--text-primary);
      font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .wrap{max-width:640px;margin:0 auto;padding:80px 20px 100px;text-align:center}
    .code{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--accent)}
    h1{font-size:26px;font-weight:700;margin:14px 0 0;line-height:1.4}
    .lead{margin:14px 0 0;font-size:15px;line-height:1.75;color:var(--text-secondary)}
    .actions{margin-top:34px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .btn{
      display:inline-block;padding:12px 22px;border-radius:10px;font-size:14px;
      font-weight:500;text-decoration:none;border:1px solid var(--border);
      background:var(--bg-card);color:var(--text-primary);transition:border-color .15s
    }
    .btn:hover{border-color:var(--border-hover)}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
    .hubs{
      margin-top:44px;padding-top:26px;border-top:1px solid var(--border);
      font-size:14px;color:var(--text-secondary)
    }
    .hubs p{margin:0 0 14px}
    .hubs a{
      display:inline-block;margin:4px 3px;padding:7px 14px;border-radius:999px;
      background:var(--bg-secondary);color:var(--text-primary);
      text-decoration:none;font-size:13px
    }
    .hubs a:hover{background:var(--accent-light);color:var(--accent)}
    @media (max-width:520px){
      .wrap{padding:56px 18px 72px}
      h1{font-size:21px}
    }
  </style>
</head>
<body>
  <!--FFP_HEADER-->
  <main class="wrap">
    <p class="code">404</p>
    <h1>찾으시는 페이지가 없습니다</h1>
    <p class="lead">
      주소가 바뀌었거나 삭제된 페이지일 수 있습니다.<br>
      아래에서 다시 찾아보세요.
    </p>
    <div class="actions">
      <a class="btn primary" href="/">폰트 전체 보기</a>
      <a class="btn" href="/magazine">매거진</a>
      <a class="btn" href="/about">폰트픽 소개</a>
      <a class="btn" href="/faq.html">자주 묻는 질문</a>
    </div>
    <div class="hubs">
      <p>이런 걸 찾으셨나요?</p>
      <a href="/use/thumbnail">유튜브 썸네일</a>
      <a href="/use/card">인스타 · 카드뉴스</a>
      <a href="/use/report">PPT · 보고서</a>
      <a href="/use/new">신상폰트</a>
      <a href="/font-pair">폰트 조합 찾기</a>
    </div>
  </main>
</body>
</html>
