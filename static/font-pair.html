<style>
  :root{
    --bg:#FAFAF7;--bg-card:#fff;--bg-secondary:#F3F3EF;
    --text-primary:#1A1A1A;--text-secondary:#6B6B6B;--text-muted:#9A9A9A;
    --border:rgba(0,0,0,.09);--border-hover:rgba(0,0,0,.18);
    --accent:#1E3A8A;--accent-light:#EEF2FB;--accent-hover:#16307A;
    --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
    --shadow-card:0 1px 4px rgba(0,0,0,.06);--shadow-hover:0 6px 20px rgba(0,0,0,.1);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#141414;--bg-card:#1E1E1E;--bg-secondary:#2A2A2A;
    --text-primary:#F0F0EC;--text-secondary:#A0A09A;--text-muted:#666660;
    --border:rgba(255,255,255,.1);--border-hover:rgba(255,255,255,.2);
    --accent:#5B82E0;--accent-light:#141A2A;--accent-hover:#7B9CE8;
    --shadow-card:0 1px 4px rgba(0,0,0,.3);--shadow-hover:0 6px 24px rgba(0,0,0,.4);
    color-scheme:dark;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#141414;--bg-card:#1E1E1E;--bg-secondary:#2A2A2A;
      --text-primary:#F0F0EC;--text-secondary:#A0A09A;--text-muted:#666660;
      --border:rgba(255,255,255,.1);--border-hover:rgba(255,255,255,.2);
      --accent:#5B82E0;--accent-light:#141A2A;--accent-hover:#7B9CE8;
      --shadow-card:0 1px 4px rgba(0,0,0,.3);--shadow-hover:0 6px 24px rgba(0,0,0,.4);
      color-scheme:dark;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ui:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}
  /* 홈·상세와 같은 규칙을 쓴다. 예전에는 여기만 -webkit-font-smoothing 을
     걸어 두어 화면에 따라 획이 얇게 보였다. */
  body{font-family:var(--ui);background:var(--bg);color:var(--text-primary);
       line-height:1.6;min-height:100vh;padding-top:57px}

  .fp-wrap{max-width:1240px;margin:0 auto;padding:18px 24px 60px}

  /* ── 상단 바 ───────────────────────────────────────── */
  .fp-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .fp-seg{display:inline-flex;background:var(--bg-secondary);border-radius:999px;padding:3px}
  .fp-seg button{border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;
                 color:var(--text-secondary);padding:6px 14px;border-radius:999px;cursor:pointer}
  .fp-seg button.on{background:var(--bg-card);color:var(--text-primary);box-shadow:var(--shadow-card)}
  .fp-cats{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:240px}
  .fp-chip{border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);
           font-family:inherit;font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer;
           white-space:nowrap;transition:all .13s}
  .fp-chip:hover{border-color:var(--border-hover);color:var(--text-primary)}
  .fp-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .fp-act{display:flex;gap:8px}
  /* 칩 아래 설명 한 줄. 칩 이름만으로는 '포스터·안내'와 '영상·자막'이
     서로 무엇이 다른지 안 읽힌다. 고른 자리의 성격을 한 줄로 받쳐 준다. */
  .fp-catdesc{margin:-6px 0 12px;font-size:13px;line-height:1.6;
              color:var(--text-secondary);word-break:keep-all}
  .fp-btn{border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);
          font-family:inherit;font-size:13px;font-weight:600;padding:8px 15px;border-radius:8px;
          cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .fp-btn:hover{border-color:var(--border-hover)}
  .fp-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .fp-btn.primary:hover{background:var(--accent-hover)}
  .fp-btn svg{width:15px;height:15px}
  .spin svg{animation:fpspin .5s ease}
  @keyframes fpspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  /* ── 견본 = 쓰는 자리 목업 ──────────────────────────────
     고른 카테고리의 실제 자리에 조판해 "내 자리에 쓰면 어떻게 보이는가"에
     바로 답한다.

     틀은 16:9 하나로 통일했다(860×484). 자리마다 비율이 달라지면 조합이
     바뀐 건지 틀이 바뀐 건지 눈이 헷갈린다 — 비교하러 온 화면에서는 틀이
     고정이어야 폰트만 보인다. 자리 구분은 바탕색이 맡는다.

     글자 크기는 틀 폭에 비례한다(cqw). 폭이 916px이므로 1cqw = 9.16px.
     세 단은 제목 > 서브타이틀 > 본문 순으로 벌려 둔다 — 서브타이틀과 본문이
     같은 크기면 두 줄이 한 덩어리로 붙어 위계가 안 읽힌다.
     슬롯의 크기 레버가 그 위에 배수(--k-*)로 곱해진다.

     틀을 키운 것은 비율 때문이 아니었다. 막고 있던 건 페이지 폭이다 —
     여기만 1180/20 을 쓰고 사이트 나머지는 1240/24 를 쓴다. 맞추면서
     캔버스가 860 → 916px(높이 484 → 515)이 됐다. */
  /* 두 칸 높이는 그리드가 맞춘다. flex로도 해 봤지만 캔버스 높이가 비율에서
     나오는 탓에 줄 높이가 제때 잡히지 않아 아래끝이 어긋났다.
     그리드는 줄 높이를 먼저 정하고 칸을 늘리므로 어긋날 여지가 없다.
     캔버스만 align-self:start 로 빼 16:9 비율을 지킨다. */
  .fp-shell{display:grid;grid-template-columns:minmax(0,1fr) 260px;
            align-items:stretch;gap:16px;padding:6px 0 2px}
  .fp-stage{container-type:inline-size;position:relative;min-width:0;max-width:916px;
            align-self:start;
            aspect-ratio:16/9;border-radius:var(--radius-md);box-shadow:var(--shadow-hover);
            overflow:hidden;background:var(--bg-card);color:var(--text-primary);
            display:flex;flex-direction:column}
  .fp-stage::after{content:attr(data-frame);position:absolute;right:10px;bottom:8px;
                   font-family:var(--ui);font-size:10.5px;letter-spacing:.05em;
                   color:currentColor;opacity:.4;pointer-events:none}

  .fp-err{margin:12px auto 0;max-width:62ch;text-align:center;font-size:13px;color:var(--text-muted)}
  .fp-text{outline:none;word-break:keep-all;white-space:pre-line}
  .fp-text:focus{outline:2px dashed currentColor;outline-offset:4px;border-radius:3px}

  #txtTitle{font-size:calc(var(--b-title,7cqw) * var(--k-title,1));line-height:1.16}
  #txtSub  {font-size:calc(var(--b-sub,4.25cqw) * var(--k-sub,1));line-height:1.45;opacity:.8}
  #txtBody {font-size:calc(var(--b-body,2.66cqw) * var(--k-body,1));line-height:1.75}

  /* ── 자리마다 배경 사진 ───────────────────────────────
     배경을 카테고리 키가 아니라 **틀 이름(.mk-*)**에 건다. '뜻밖의 발견'은
     다른 카테고리의 틀을 빌려 쓰므로(specimen 의 borrow), 이렇게 두면 배경도
     저절로 빌린 자리를 따라간다 — 따로 이어 줄 코드가 없다.

     ⚠ 캔버스(.fp-stage)에는 padding 을 주지 않는다.
     container-type:inline-size 는 그 요소의 **콘텐츠 박스**를 기준으로 1cqw 를
     정한다. 그래서 캔버스에 좌우 여백을 주면 콘텐츠 박스가 좁아지고, 그만큼
     자식들의 cqw 가 줄어 글자가 통째로 쪼그라든다. 실제로 오른쪽 여백을
     40cqw 로 줬더니 콘텐츠 박스가 622px → 180px 이 되어 제목이 46px 대신
     13.3px 로 그려졌다("콩알만해졌다"). 게다가 캔버스 자신의 cqw 는 바깥
     컨테이너(없으면 뷰포트)를 기준으로 잡혀서 창 크기에 따라 여백이 제멋대로
     변한다. 그래서 여백은 글 덩어리가 갖는다 — 아래 --pl/--pr/--pt/--pb.

     이제 1cqw = 캔버스 폭의 1% 라 값이 그대로 읽힌다.

     ⚠ --b-title / --b-sub / --b-body 는 배경을 넣기 전과 **같은 크기로 보이도록**
     환산한 값이다. 숫자만 보면 예전보다 작지만 화면에 그려지는 크기는 같다.
     기준이 달라졌기 때문이다 — 예전에는 캔버스에 좌우 여백이 있어 1cqw 가
     콘텐츠 박스(622-134=488px) 기준이었고, 여백을 걷어낸 지금은 캔버스 전체
     (622px) 기준이다. 같은 숫자가 1.28배로 그려진다. 그래서
       배율 = 1 - 2 × 예전여백 × 뷰포트폭 / (100 × 캔버스폭)
     을 곱했다(0.79~0.88). 브라우저에서 재서 확인한 값이고, 제목이 68→56 /
     52→41 px 로 내려가면서 줄 수는 그대로다.
     그 뒤 "전반적으로 커 보인다"는 말을 듣고 여섯 자리 모두 다시 0.8 을
     곱했다. 지금 값은 그 결과다.
     이 숫자를 다시 만질 때는 반드시 화면에서 px 를 재고 만진다 —
     값만 보고 고치다 "콩알만하다" 와 "너무 크다" 를 둘 다 들었다.
     배경을 피하는 일은 여백(--pl/--pr)이 한다. 크기를 줄여서 피하려다
     "콩알만해졌다"는 말을, 여백을 늘리려다 "너무 커지고 줄이 갈라진다"는 말을
     들었다. 아래 --pr 값은 짐작이 아니라 브라우저에서 실제로 재서 정했다 —
     그 크기에서 제목·부제·본문이 몇 줄이 되고 어디까지 뻗는지 확인한 값이다.

     왼쪽 여백(--pl)은 '글을 빈 쪽 가운데에 놓기 위한 값'이다. 6~7cqw 로
     두었더니 글이 왼쪽 끝에 붙어 보였다 — 장식이 오른쪽에 몰려 있어 글 폭이
     좁다 보니 같은 여백이어도 한쪽으로 쏠려 읽힌다. 그래서 '왼쪽 끝 ~ 장식이
     시작하는 곳' 사이의 가운데에 오도록 잡았다(영상 12 / SNS 17 / 브랜딩 20).

     세로 여백은 캔버스에 줘도 된다(container-type:inline-size 는 가로만 본다).
     다만 여기서는 가로와 같이 두는 편이 읽기 쉬워 블록에 함께 실었다. */
  .fp-stage{background-size:cover;background-position:center;background-repeat:no-repeat}
  .fp-blk-title,.fp-blk-sub,.fp-blk-body{padding-left:var(--pl,7cqw);
                                         padding-right:var(--pr,7cqw)}
  /* 가운데 정렬(justify-content:center)을 쓰는 자리는 --pt 와 --pb 를 같은
     값으로 둔다. 다르면 그 차이만큼 글 덩어리가 위나 아래로 밀린다. */
  .fp-blk-title{padding-top:var(--pt,7cqw)}
  .fp-blk-body{padding-bottom:var(--pb,7cqw)}

  /* 영상 · 자막 — 밤 사진. 왼쪽 어둠에 제목을 앉힌다.
     인물이 시작하는 곳은 눈대중이 아니라 사진의 밝기를 훑어서 쟀다 —
     제목이 앉는 높이(세로 28~60%)에서 어두운 배경이 끝나는 지점이 63.4% 다.
     제목은 58.9% 에서 끝나 4.5%p 가 남는다. 이 자리만 제목을 10% 키운 값이다.
     자막 바는 아래 전체 폭 그대로 — 영상 자막이 원래 그 자리다.
     실측(캔버스 622px): 제목 3줄·오른끝 65%, 부제 1줄·72%, 자막 1줄.
     제목이 3줄이 되는 것은 배경을 넣기 전에도 같았다 — 원래 크기가 그렇다. */
  .mk-thumb{background-image:url(/pair-bg/thumb.webp);background-color:#15161A;
            color:#F7F5F1;justify-content:center;text-align:left;
            --pl:12cqw;--pr:6cqw;--pt:6cqw;--pb:0cqw;
            --b-title:7.92cqw;--b-sub:2.94cqw;--b-body:1.74cqw}
  .mk-thumb .fp-blk-title,.mk-thumb .fp-blk-sub{text-shadow:0 1px 14px rgba(0,0,0,.6)}
  .mk-thumb .fp-blk-body{position:absolute;left:0;right:0;bottom:0;
            background:rgba(0,0,0,.55);padding:2.4cqw 6cqw 2.8cqw;text-align:center}
  .mk-thumb #txtSub{margin-top:2.2cqw;opacity:.9}
  /* 자막 바가 아래를 덮으므로 가운데 정렬 기준을 그만큼 위로 올린다 */
  .mk-thumb .fp-blk-sub{padding-bottom:12cqw}

  /* SNS · 카드뉴스 — 살구빛 도형이 오른쪽 70% 부터. 왼쪽 위부터 쌓는다.
     실측: 제목 1줄·오른끝 58%, 본문 5줄·68%. 도형이 70%부터라 닿지 않는다. */
  .mk-card{background-image:url(/pair-bg/card.webp);background-color:#FAEBD9;
           color:#3B2E1E;justify-content:center;
           --pl:17cqw;--pr:7cqw;--pt:7cqw;--pb:7cqw;
           --b-title:5.26cqw;--b-sub:2.83cqw;--b-body:1.79cqw}
  .mk-card #txtSub{margin-top:2.8cqw}
  .mk-card .fp-blk-body{margin-top:4cqw}

  /* 브랜딩 · 로고 — 옅은 미색. 오른쪽 위 아치(75%~)와 왼쪽 아래 물결(아래 28%)
     사이, 가운데 높이에 왼쪽으로 앉힌다.
     실측: 제목 44%, 부제 39%, 본문 69%. 아치가 75%부터라 여유가 있다. */
  .mk-namecard{background-image:url(/pair-bg/namecard.webp);background-color:#F6F4EF;
               color:#241F19;justify-content:center;
               --pl:20cqw;--pr:7cqw;--pt:7cqw;--pb:7cqw;
               --b-title:5.54cqw;--b-sub:2.68cqw;--b-body:1.67cqw}
  .mk-namecard #txtSub{margin-top:2.2cqw}
  .mk-namecard .fp-blk-body{margin-top:4cqw;opacity:.75}

  /* 포스터 · 안내 — 겨울 정원. 오른쪽 아래 식물과 왼쪽 위 나뭇가지를 피해
     왼쪽 가운데 띠에. --pr 20 은 실측으로 고른 값 — 6 이면 본문이 90%까지
     뻗어 오른쪽 식물에 얹히고, 26 부터는 부제가 두 줄로 갈라진다. 20 에서
     본문 3줄·오른끝 76%. */
  .mk-poster{background-image:url(/pair-bg/poster.webp);background-color:#EAF0F6;
             color:#243444;justify-content:center;
             --pl:14cqw;--pr:20cqw;--pt:9cqw;--pb:9cqw;
             --b-title:5.67cqw;--b-sub:2.88cqw;--b-body:1.81cqw}
  .mk-poster #txtSub{margin-top:2cqw}
  /* 본문 줄바꿈을 부제 길이에 맞춘다. 본문만 오른쪽으로 훨씬 길게 뻗으면
     세 줄이 계단처럼 어긋나 보이고 오른쪽 식물 쪽으로도 밀린다.
     34cqw 는 실측으로 고른 값 — 왼쪽 여백 14cqw 와 짝지으면 본문 오른끝
     61.2%, 부제 61.0% 로 두 줄의 오른쪽 끝이 나란해진다. */
  .mk-poster .fp-blk-body{margin-top:2.4cqw;padding-right:34cqw}

  /* 감성 · 손글씨 — 찢어진 종이가 가운데(가로 8~78%). 종이 안쪽에만.
     좌우 여백이 다른 것은 종이 가운데가 화면 가운데보다 왼쪽이라서다.
     --pr 22 도 실측 — 6 이면 본문이 88%까지 가서 종이 밖(78%)으로 나간다. */
  .mk-note{background-image:url(/pair-bg/note.webp);background-color:#EDE6D8;
           color:#3A3226;justify-content:center;text-align:center;
           --pl:13cqw;--pr:22cqw;--pt:10cqw;--pb:10cqw;
           --b-title:5.54cqw;--b-sub:2.76cqw;--b-body:1.74cqw}
  /* 이 자리는 제목과 본문 둘로 끝낸다. 필적이 먼저 닿는 자리라 가운데에
     한 줄 더 끼면 오히려 흐려진다. 오른쪽 슬롯도 함께 비활성으로 둔다. */
  .mk-note .fp-blk-sub{display:none}
  .mk-note #txtSub{margin-top:2.6cqw}
  .mk-note .fp-blk-body{margin-top:3.6cqw}

  /* 본문 · 읽기 — 종이를 코드로 그렸다(tools/make_pair_bg_magazine.py).
     그 배경에는 선이 하나도 없다. 제목 아래 선과 단 사이 선을 CSS 가 긋기
     때문이다 — 그래야 글이 한 줄 늘거나 줄어도 선이 글을 따라간다.
     앞서 쓰던 사진에는 가로줄이 박혀 있었고, 거기 맞추려다 본문이 위로
     끌려 올라갔다. 그 문제가 여기서 없어진다.

     선을 .fp-blk-body 에 긋되 좌우를 padding 이 아니라 margin 으로 잡는다.
     padding 이면 테두리가 칸 전체 폭으로 그어져 글줄보다 길게 삐져나온다.
     margin 이면 테두리 상자 자체가 안으로 들어와 글 폭과 정확히 맞는다.

     좌우 여백을 같게 둔 것은 제본 그림이 없어져서다.

     이 자리만 축소를 20% 가 아니라 10% 로 뒀다 — 읽는 자리라 본문이 더
     작아지면 판단이 어렵다. 세로는 가운데 정렬이다. 위에 붙여 두었더니
     아래가 비어 보였고, 가운데로 두면 글이 길어지거나 짧아져도 위아래가
     저절로 맞는다(실측 위 20.3% / 아래 21.3%). */
  .mk-magazine{background-image:url(/pair-bg/magazine.webp);background-color:#FAF7F0;
               color:#2A241B;justify-content:center;
               --pl:9cqw;--pr:9cqw;--pt:7cqw;--pb:7cqw;
               --b-title:6.08cqw;--b-sub:3.36cqw;--b-body:1.95cqw}
  .mk-magazine #txtSub{margin-top:2.2cqw;opacity:.72}
  .mk-magazine #txtBody{line-height:1.7}
  .mk-magazine .fp-blk-body{padding-left:0;padding-right:0;
               margin:3.4cqw var(--pr) 0 var(--pl);
               padding-top:2.2cqw;
               border-top:1px solid color-mix(in srgb,currentColor 22%,transparent);
               column-count:2;column-gap:3.2cqw;
               column-rule:1px solid color-mix(in srgb,currentColor 12%,transparent)}

  /* ── 오른쪽 칸: 슬롯 3개 + 쓰는 법 ─────────────────────
     캔버스 옆에 세로로 세운다. 아래에 두면 스크롤을 내려야 폰트 이름이
     보였다 — 무슨 폰트인지가 견본과 같이 보여야 한다.
     슬롯 아래로 남는 자리에 쓰는 법을 넣어 칸을 채운다. */
  .fp-side{display:flex;flex-direction:column;gap:12px;min-width:0}
  .fp-slots{display:flex;flex-direction:column;gap:10px}
  .fp-slot{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);
           padding:10px 12px 7px;display:flex;flex-direction:column;gap:5px}
  .fp-slot-top{display:flex;align-items:center;gap:10px}
  .fp-slot-bottom{display:flex;align-items:center;gap:8px}
  .fp-slot.locked{border-color:var(--accent);background:var(--accent-light)}
  .fp-role{width:30px;height:30px;flex:none;border-radius:8px;background:var(--bg-secondary);
           display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--text-secondary)}
  .fp-slot-main{flex:1;min-width:0}
  .fp-slot-role{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--text-muted);
                line-height:1.3}
  .fp-slot-font{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
                display:block;color:inherit;text-decoration:none;line-height:1.35}
  a.fp-slot-font:hover{text-decoration:underline}
  .fp-slot.fam{border-color:var(--border-hover)}
  /* 이 틀에서 안 쓰는 슬롯 — 눌러도 화면이 안 바뀌므로 손댈 수 없게 둔다 */
  .fp-slot.off{opacity:.45;pointer-events:none;background:var(--bg-secondary)}
  .fp-off{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:999px;
          background:var(--bg-secondary);color:var(--text-muted);font-size:9.5px;
          font-weight:700;letter-spacing:0;vertical-align:1px}
  .fp-fam{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:999px;
          background:var(--accent-light);color:var(--accent);font-size:9.5px;
          font-weight:800;letter-spacing:0;vertical-align:1px}
  .fp-slot-w{font-size:10.5px;color:var(--text-muted);font-weight:500;white-space:nowrap;
             line-height:1.3}
  .fp-icons{display:flex;gap:2px;flex:none}
  .fp-icon{border:none;background:none;cursor:pointer;color:var(--text-muted);padding:5px;border-radius:6px;
           display:grid;place-items:center;text-decoration:none}
  .fp-icon:hover{background:var(--bg-secondary);color:var(--text-primary)}
  .fp-icon.on{color:var(--accent)}
  .fp-icon svg{width:16px;height:16px}
  /* 크기 레버 — 틀은 16:9로 고정이라 자리마다 원하는 크기가 다르다.
     기본값에 배수(--k-*)를 곱하는 방식이라 틀이 바뀌어도 비례가 유지된다.
     선은 2px까지 얇게 눕힌다. 조작이 아니라 폰트를 보러 온 화면이라
     손잡이만 보이면 된다. 눌리는 영역은 12px로 남겨 둔다. */
  .fp-size{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:14px;
           margin:0;background:none;cursor:pointer}
  .fp-size::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:var(--border)}
  .fp-size::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
           border-radius:50%;background:var(--accent);margin-top:-4px}
  .fp-size::-moz-range-track{height:2px;border-radius:2px;background:var(--border)}
  .fp-size::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;
           background:var(--accent)}

  /* ── 미세조정 패널 ──────────────────────────────────── */

  @media(max-width:900px){
    .fp-shell{grid-template-columns:minmax(0,1fr)}
    .fp-stage{max-width:none}
    .fp-side{width:auto}
    .fp-about{flex:none}
    .fp-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  }
  @media(max-width:560px){
    .fp-stage{aspect-ratio:auto;min-height:340px}
    /* 16:9 사진이 세로로 긴 칸에 들어가면 좌우가 잘린다. 글이 놓인 빈 쪽을
       남기도록 잘리는 위치를 왼쪽으로 당긴다. 가운데를 쓰는 두 자리
       (종이·노트)는 그대로 둔다. */
    .mk-thumb,.mk-card,.mk-namecard,.mk-poster{background-position:26% center}
    /* 장식이 잘려 나갔으니 글도 폭을 다시 쓴다 */
    .mk-thumb{--pr:8cqw}
    .mk-card,.mk-namecard,.mk-poster{--pr:9cqw}
    .mk-note{--pl:12cqw;--pr:12cqw}
    /* 좁은 화면에서는 2단이 너무 좁아진다. 한 단으로 편다. */
    .mk-magazine .fp-blk-body{column-count:1}
    /* 데스크톱은 16:9 비율이라 justify-content:flex-start(위 붙임)로 놓아도
       박스 자체가 낮아서 자연스럽다. 모바일은 그 비율을 버리고 최소높이
       340px만 남기는데, 폭이 좁아지면서 박스가 훨씬 세로로 길어져 글이
       위쪽에만 뜨고 아래가 텅 빈다 — 실측: brand(namecard) 위26/아래238px,
       sns(card) 위26/아래208px, read(magazine) 위13/아래203px. 세 자리
       모두 flex-start를 쓰던 곳이다. 이미 center인 hand·poster는
       118/118, 128/128로 문제가 없었다. 같은 규칙으로 맞춘다. */
    .mk-namecard,.mk-card,.mk-magazine{justify-content:center}
  }

  /* ── 폰트 고르기 ────────────────────────────────────── */
  .fp-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:none;
            align-items:center;justify-content:center;padding:20px}
  .fp-modal.open{display:flex}
  .fp-modal-box{background:var(--bg-card);border-radius:var(--radius-lg);width:min(560px,100%);
                max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
  .fp-modal-head{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
  .fp-modal-head h2{font-size:15px;font-weight:800;margin-bottom:9px}
  .fp-modal-head input{width:100%;height:36px;border:1px solid var(--border);border-radius:8px;
                       padding:0 12px;font-family:inherit;font-size:13px;background:var(--bg-secondary);
                       color:var(--text-primary);outline:none}
  .fp-modal-head input:focus{border-color:var(--accent)}
  .fp-list{overflow-y:auto;padding:6px}
  .fp-item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;
           padding:9px 12px;border-radius:8px;cursor:pointer}
  .fp-item:hover{background:var(--bg-secondary)}
  /* 이름을 그 폰트로 그린다 — 목록에서 모양을 못 보면 고를 수가 없다.
     파일은 화면에 들어온 줄만 받는다(아래 IntersectionObserver). */
  .fp-item b{font-size:21px;font-weight:400;line-height:1.4;font-family:var(--ui)}
  .fp-item i{font-size:11.5px;color:var(--text-muted);font-style:normal;font-family:var(--ui)}
  .fp-empty{padding:22px;text-align:center;color:var(--text-muted);font-size:13px}

  /* ── 사용팁 — 오른쪽 칸 슬롯 아래 ─────────────────────── */
  .fp-about{flex:1 1 0;min-height:0;overflow:hidden;background:var(--bg-secondary);
            border-radius:var(--radius-md);padding:11px 13px}
  .fp-about h2{font-size:11.5px;font-weight:800;letter-spacing:.06em;
               color:var(--text-muted);margin-bottom:7px}
  .fp-about ul{list-style:none;display:flex;flex-direction:column;gap:6px}
  .fp-about li{position:relative;padding-left:10px;font-size:12px;line-height:1.55;
               color:var(--text-secondary);word-break:keep-all}
  .fp-about li::before{content:'';position:absolute;left:0;top:8px;width:4px;height:4px;
               border-radius:50%;background:var(--text-muted);opacity:.6}
  .fp-about b{font-weight:700;color:var(--text-primary)}
  /* 다음 읽을거리로 가는 길. 소개 글을 복사해 오지 않고 링크만 건다 —
     같은 글이 두 주소에 앉으면 중복 콘텐츠가 된다. */
  .fp-more{flex:none;padding-top:2px;font-size:12px;line-height:1.5;
           color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fp-more a{color:var(--accent);font-weight:700;text-decoration:none}
  .fp-more a:hover{text-decoration:underline}

  /* ── 캔버스 아래 안내 글 ──
     화면 위쪽 칩은 '지금 고른 자리' 하나의 설명만 보여준다. 나머지 여섯은
     눌러 보기 전에는 읽을 수 없어서, 무엇을 고를 수 있는 자리인지 한눈에
     들어오지 않았다. 일곱을 여기 펼친다.
     크롤러가 읽을 글이기도 하다 — 이 페이지는 화면을 전부 JS가 그려서,
     이 블록이 없으면 본문이 메뉴 이름뿐이 된다. */
  .fp-guide{margin-top:44px;padding-top:34px;border-top:1px solid var(--border)}
  .fp-guide h1{font-size:17px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
  .fp-guide .lead{font-size:13.5px;color:var(--text-secondary);line-height:1.7;
    margin-bottom:22px;word-break:keep-all}
  .fp-guide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;
    background:var(--border);border:1px solid var(--border)}
  @media(max-width:760px){.fp-guide-grid{grid-template-columns:1fr}}
  .fp-guide-cell{background:var(--bg-card);padding:16px 17px}
  .fp-guide-cell h3{font-size:14px;font-weight:800;letter-spacing:-.3px;margin-bottom:5px}
  .fp-guide-cell p{font-size:12.8px;line-height:1.65;color:var(--text-secondary);
    word-break:keep-all}
  .fp-guide-cell .themes{display:block;margin-top:8px;font-size:11.5px;
    color:var(--text-muted);line-height:1.6}
  /* 그 자리에 맞는 폰트 링크. 크롤러에게 상세페이지로 가는 길을 주고,
     사람에게는 "그래서 뭘 쓰라는 건데"에 대한 답을 준다. */
  .fp-guide-picks{display:block;margin-top:9px;font-size:12px;line-height:1.9;
    color:var(--text-muted)}
  .fp-guide-picks a{color:var(--text-secondary);text-decoration:none;
    border-bottom:1px solid var(--border)}
  .fp-guide-picks a:hover{color:var(--accent);border-bottom-color:var(--accent)}
  .fp-guide-note{margin-top:26px}
  .fp-guide-note h3{font-size:14.5px;font-weight:800;margin-bottom:9px}
  .fp-guide-note li{font-size:13px;line-height:1.75;color:var(--text-secondary);
    margin-left:17px;word-break:keep-all}
  .fp-about p{font-size:12.5px;color:var(--text-secondary);line-height:1.8;
              word-break:keep-all}
</style>
</head>
<body>

<!--FFP_HEADER-->

<main class="fp-wrap">

  <div class="fp-bar">
    <div class="fp-seg" id="fpScript">
      <button type="button" data-sc="ko" class="on">한글</button>
      <button type="button" data-sc="en">영문</button>
      <button type="button" data-sc="mix">혼합</button>
    </div>
    <div class="fp-cats" id="fpCats"></div>
    <div class="fp-act">
      <button type="button" class="fp-btn primary" id="fpRoll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
        조합 새로고침
      </button>
    </div>
  </div>

  <p class="fp-catdesc" id="fpCatDesc">{{FFP_PAIR_DESC}}</p>

  <div class="fp-shell">
    <section class="fp-stage mk-card" id="fpStage" data-frame="">
      <div class="fp-blk-title">
        <div class="fp-text" id="txtTitle" contenteditable="true" spellcheck="false"></div>
      </div>
      <div class="fp-blk-sub">
        <p class="fp-text" id="txtSub" contenteditable="true" spellcheck="false"></p>
      </div>
      <div class="fp-blk-body">
        <div class="fp-text" id="txtBody" contenteditable="true" spellcheck="false"></div>
      </div>
    </section>

    <aside class="fp-side">
      <section class="fp-slots" id="fpSlots"></section>
      {{FFP_PAIR_SSR}}
    </aside>
  </div>

  <p class="fp-err" id="fpErr" hidden></p>

  {{FFP_PAIR_GUIDE}}

</main>


<div class="fp-modal" id="fpPicker">
  <div class="fp-modal-box">
    <div class="fp-modal-head">
      <h2 id="fpPickerTitle">폰트 고르기</h2>
      <input type="text" id="fpPickerQ" placeholder="폰트명 또는 제작사로 찾기" autocomplete="off">
    </div>
    <div class="fp-list" id="fpPickerList"></div>
  </div>
</div>

<script src="/static/ffp-fontface.js"></script>
<script>
(function(){
  'use strict';

  /* 처음 열었을 때 — 서버의 DEFAULT_CATEGORY(app/pair_specimens.py) 와
     같아야 주소가 깔끔하다. 영상·자막은 제목과 자막의 크기 차이가 뚜렷해
     세 자리가 어떻게 나뉘어 일하는지가 한눈에 보인다. */
  var DEFAULT_CAT = 'video';

  /* 첫 화면에 앉힐 폰트. 무작위로 뽑으면 열 때마다 다른 인상을 주는데,
     첫 인상은 정해 두는 편이 낫다. 주소에 폰트가 지정돼 있으면 그쪽이 이긴다.
     잠그지는 않으므로 '조합 새로고침'을 누르면 평소대로 다시 뽑는다. */
  var DEFAULT_FONTS = { title: 62, subtitle: 59, body: 10 };

  var SLOTS = ['title', 'subtitle', 'body'];
  var ROLE  = { title: '타이틀', subtitle: '서브타이틀', body: '본문' };
  var ABBR  = { title: 'H1', subtitle: 'Aa', body: 'T' };
  var VAR   = { title: 'title', subtitle: 'sub', body: 'body' };   // CSS 변수 접미사

  var S = {
    cat: DEFAULT_CAT,
    script: 'ko',
    fonts:   { title: null, subtitle: null, body: null },
    weights: { title: 700, subtitle: 500, body: 400 },
    lock:    { title: false, subtitle: false, body: false },
    mockup:  '',         // 지금 그리고 있는 틀 이름 (applyMockup 이 채운다)
    family:  [],         // 같은 폰트의 다른 굵기로 묶인 두 슬롯 (서버가 정한다)
    scale:   { title: 1, subtitle: 1, body: 1 },   // 슬롯 크기 레버 배수
    borrow:  ''          // '뜻밖의 발견'이 어느 틀을 빌렸는지 (주소로 재현하려면 필요)
  };

  var CATS = [];
  var ALL_FONTS = null;      // 폰트 고르기 목록 (한 번만 받는다)
  var pickerSlot = null;

  function $(id){ return document.getElementById(id); }
  function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

  // ── 주소 ────────────────────────────────────────────
  /* 조합과 조정값을 주소에 담는다. 기본값인 항목은 빼서 주소를 짧게 둔다.
     갱신은 replaceState — 슬라이더를 움직일 때마다 히스토리가 쌓이면
     뒤로가기가 망가진다. */
  function syncUrl(){
    var q = [];
    if (S.cat !== DEFAULT_CAT) q.push('cat=' + S.cat);
    if (S.script !== 'ko') q.push('sc=' + S.script);
    var lk = '';
    SLOTS.forEach(function(k, i){
      if (S.fonts[k]) q.push(['t','s','b'][i] + '=' + S.fonts[k].id);
      if (S.lock[k]) lk += ['t','s','b'][i];
    });
    if (lk) q.push('lock=' + lk);
    var url = location.pathname + (q.length ? '?' + q.join('&') : '');
    if (url !== location.pathname + location.search) history.replaceState(null, '', url);
  }
  function readUrl(){
    var p = new URLSearchParams(location.search);
    if (p.get('cat')) S.cat = p.get('cat');
    if (p.get('sc'))  S.script = p.get('sc');
    var lk = p.get('lock') || '';
    SLOTS.forEach(function(k, i){ S.lock[k] = lk.indexOf(['t','s','b'][i]) >= 0; });
    return { title: +p.get('t') || 0, subtitle: +p.get('s') || 0, body: +p.get('b') || 0 };
  }

  // ── 그리기 ──────────────────────────────────────────
  /* 목업 틀 이름 → 화면 라벨. 틀 구석에 작게 적어 둔다 —
     지금 무엇을 보고 있는지가 화면에서 읽혀야 한다. */
  /* 틀이 전부 가로형이라 치수를 적으면 거짓말이 된다. 대신 어느 자리를
     보고 있는지를 적는다 — '뜻밖의 발견'은 틀을 빌려 쓰므로 특히 필요하다. */
  var FRAME_LABEL = { thumb:'영상 · 자막', card:'SNS · 카드뉴스',
                      namecard:'브랜딩 · 로고', poster:'포스터 · 안내',
                      note:'감성 · 손글씨', magazine:'본문 · 읽기' };
  /* 이 틀에서 쓰지 않는 슬롯. 화면에서 뺀 자리를 오른쪽 목록에만 남겨 두면
     "왜 폰트를 골라도 안 바뀌지" 가 된다. */
  var UNUSED_SLOTS = { note: ['subtitle'] };

  function applyMockup(name){
    var st = $('fpStage');
    S.mockup = name || 'card';
    st.className = 'fp-stage mk-' + (name || 'card');
    st.setAttribute('data-frame', FRAME_LABEL[name] || '');
  }

  /* 배경 사진을 미리 받아 둔다. 자리를 바꾸는 순간 받기 시작하면 한 박자
     늦게 깔려서 빈 색만 보였다가 사진이 들어온다. 여섯 장 합쳐 274KB 라
     첫 그림이 그려진 뒤에 조용히 받아 두면 된다. */
  function prefetchBackgrounds(){
    ['thumb','card','namecard','poster','note','magazine'].forEach(function(n){
      var i = new Image(); i.src = '/pair-bg/' + n + '.webp';
    });
  }

  /* 크기 레버 — 기본 크기(--b-*)에 배수(--k-*)를 곱한다. 값을 직접 px로
     쓰지 않는 이유는 틀이 바뀌어도 비례가 유지돼야 하기 때문이다. */
  function applyScale(){
    var st = $('fpStage');
    SLOTS.forEach(function(k){ st.style.setProperty('--k-' + VAR[k], S.scale[k]); });
  }
  function resetScale(){
    SLOTS.forEach(function(k){ S.scale[k] = 1; });
    applyScale();
  }

  function renderStage(){
    SLOTS.forEach(function(k){
      var f = S.fonts[k];
      if (!f) return;
      /* stack과 weight를 한 쌍으로 받아 그대로 적는다 — 그 굵기의 파일이 직접
         그리는 경우에 CSS로 굵기를 또 요구하면 가짜 볼드가 덧씌워진다. */
      var face = FFPFont.faceFor(f, S.weights[k]);
      var el = $({ title: 'txtTitle', subtitle: 'txtSub', body: 'txtBody' }[k]);
      el.style.fontFamily = face.stack;
      el.style.fontWeight = face.weight;
    });
  }

  function renderSlots(){
    $('fpSlots').innerHTML = SLOTS.map(function(k){
      var f = S.fonts[k];
      if (!f) return '';
      /* 두 슬롯이 같은 폰트로 나오는 자리가 있다. 표시가 없으면 "왜 똑같지,
         고장 났나"로 읽힌다 — 굵기로 위계를 주려고 일부러 묶은 것이다. */
      var fam = S.family.indexOf(k) >= 0;
      var off = (UNUSED_SLOTS[S.mockup] || []).indexOf(k) >= 0;
      return '<div class="fp-slot' + (S.lock[k] ? ' locked' : '') + (off ? ' off' : '') +
        (fam ? ' fam' : '') + '" data-slot="' + k + '">' +
        '<div class="fp-slot-top">' +
        '<div class="fp-role">' + ABBR[k] + '</div>' +
        '<div class="fp-slot-main">' +
          '<div class="fp-slot-role">' + ROLE[k] +
            (fam ? '<span class="fp-fam" title="같은 폰트를 굵기만 달리해 씁니다 — ' +
                   '가장 실패가 적은 방법입니다">같은 집안</span>' : '') +
            (off ? '<span class="fp-off">이 자리에서는 쓰지 않음</span>' : '') + '</div>' +
          '<a class="fp-slot-font" href="/font/' + f.id + '" target="_blank" rel="noopener"' +
            ' title="' + esc(f.name) + ' 상세페이지 — 새 창에서 다운로드 · 라이선스">' +
            esc(f.name) + '</a>' +
          '<div class="fp-slot-w">굵기 ' + S.weights[k] +
            ' · 크기 ' + Math.round(S.scale[k] * 100) + '%</div>' +
        '</div></div>' +
        '<div class="fp-slot-bottom">' +
        '<input type="range" class="fp-size" data-size="' + k + '" min="0.6" max="1.7" ' +
          'step="0.05" value="' + S.scale[k] + '" aria-label="' + ROLE[k] + ' 크기">' +
        '<div class="fp-icons">' +
          '<button type="button" class="fp-icon' + (S.lock[k] ? ' on' : '') + '" data-lock="' + k +
            '" title="' + (S.lock[k] ? '잠금 해제' : '이 슬롯 고정 — 새로 뽑아도 안 바뀝니다') + '">' +
            (S.lock[k]
              ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
              : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>') +
          '</button>' +
          '<button type="button" class="fp-icon" data-pick="' + k + '" title="폰트 직접 고르기">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>' +
          '</button>' +
          '<a class="fp-icon" href="/font/' + f.id + '" target="_blank" rel="noopener"' +
            ' title="' + esc(f.name) + ' 상세페이지 — 새 창에서 다운로드 · 라이선스">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
          '</a>' +
        '</div></div></div>';
    }).join('');
  }

  function renderCats(){
    $('fpCats').innerHTML = CATS.map(function(c){
      return '<button type="button" class="fp-chip' + (c.key === S.cat ? ' on' : '') +
             '" data-cat="' + c.key + '">' + esc(c.label) + '</button>';
    }).join('');
    var cur = CATS.filter(function(c){ return c.key === S.cat; })[0];
    /* 목록을 못 받았으면 서버가 박아 둔 줄을 그대로 둔다 — 비우지 않는다 */
    if (cur && cur.desc) $('fpCatDesc').textContent = cur.desc;
  }

  // ── 조합 받아오기 ───────────────────────────────────
  function showErr(msg){
    var e = $('fpErr');
    e.textContent = msg || '';
    e.hidden = !msg;
  }

  var rolling = false;
  function roll(){
    if (rolling) return;
    rolling = true;
    var btn = $('fpRoll');
    btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin');

    var q = ['category=' + encodeURIComponent(S.cat), 'script=' + S.script];
    SLOTS.forEach(function(k){
      if (S.lock[k] && S.fonts[k]) q.push(k + '=' + S.fonts[k].id);
    });
    // 틀을 빌려 쓰는 카테고리는 계속 같은 틀을 유지한다. 새로 뽑을 때마다
    // 틀까지 바뀌면 폰트가 달라진 건지 자리가 달라진 건지 알 수 없다.
    if (S.borrow) q.push('borrow=' + S.borrow);
    fetch('/api/font-pair/generate?' + q.join('&'))
      .then(function(r){ if (!r.ok) throw new Error('generate'); return r.json(); })
      .then(function(d){
        S.fonts = d.fonts;
        S.weights = d.weights;
        S.family = d.family || [];
        setText(d.samples);
        showErr('');
        renderStage(); renderSlots(); syncUrl();
      })
      .catch(function(){
        /* 실패해도 화면을 비우지 않는다 — 보고 있던 조합이 사라지면 더 나쁘다 */
        showErr('조합을 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.');
      })
      .then(function(){ rolling = false; });
  }

  /* 문구는 사용자가 고쳐 쓸 수 있다. 고쳐 쓴 뒤에는 조합을 새로 뽑아도
     그 문구를 지키고, 카테고리를 바꿀 때만 새 문구로 갈아끼운다. */
  var textEdited = false;
  function setText(samples){
    /* 틀은 문구를 고쳐 썼더라도 항상 갈아끼운다 — 카테고리가 바뀌면 자리가
       바뀌는 것이지 글만 바뀌는 것이 아니다. */
    applyMockup(samples.mockup);
    S.borrow = samples.borrowed || '';
    if (textEdited) return;
    $('txtTitle').textContent = samples.title;
    $('txtSub').textContent   = samples.subtitle;
    $('txtBody').textContent  = samples.body;
  }

  // ── 미세조정 패널 ───────────────────────────────────
  // ── 폰트 고르기 ─────────────────────────────────────
  /* 스크립트 규칙을 화면에서도 지킨다 — 영문 전용 폰트에 한글 문구를 얹으면
     글리프가 없어 통째로 깨진다(서버의 _script_pools와 같은 규칙). */
  function allowedFor(slot){
    if (S.script === 'en') return 'en';
    if (S.script === 'mix') return slot === 'title' ? 'en' : 'ko';
    return 'ko';
  }
  function openPicker(slot){
    pickerSlot = slot;
    $('fpPickerTitle').textContent = ROLE[slot] + ' 폰트 고르기';
    $('fpPickerQ').value = '';
    $('fpPicker').classList.add('open');
    $('fpPickerQ').focus();
    /* 늘 맨 위에서 시작한다 — 지난번에 보던 자리에 그대로 서 있으면
       목록을 새로 여는 것인지 이어 보는 것인지 알 수 없다. */
    $('fpPickerList').scrollTop = 0;
    if (ALL_FONTS) { drawPicker(); return; }
    $('fpPickerList').innerHTML = '<div class="fp-empty">불러오는 중…</div>';
    /* ?weights=1 로 굵기까지 받는다. 이게 없으면 faceFor 가 '굵기 파일 없음'
       으로 보고 대표 파일 하나를 1~999 범위로 깔아, 700 을 골라도 대표 파일의
       원래 굵기가 그려진다. 새로고침하면 조합 API 가 굵기를 실어 주므로
       그때만 제대로 나왔다 — 고른 직후와 새로고침 뒤가 달랐던 이유다. */
    fetch('/api/fonts?weights=1').then(function(r){ return r.json(); }).then(function(list){
      ALL_FONTS = list || []; drawPicker();
    }).catch(function(){
      $('fpPickerList').innerHTML = '<div class="fp-empty">폰트 목록을 불러오지 못했어요.</div>';
    });
  }
  /* 목록의 폰트 파일은 화면에 들어온 줄만 받는다. 한글 폰트만 180종이라
     한 번에 다 받으면 목록이 뜨기까지 한참 걸린다. */
  var pickIO = null, pickIndex = {};
  function paintRow(row){
    var f = pickIndex[row.dataset.fid];
    if (!f) return;
    if (f.webfont_family && f.file_source !== 'user') FFPFont.resolveWebfont(f);
    else FFPFont.ensureFont(f);
    var nm = row.querySelector('b');
    if (nm) nm.style.fontFamily = FFPFont.stackOf(f);
  }
  function observeRows(){
    if (pickIO) pickIO.disconnect();
    var rows = $('fpPickerList').querySelectorAll('[data-fid]');
    if (!('IntersectionObserver' in window)) {
      [].forEach.call(rows, paintRow);
      return;
    }
    pickIO = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if (!e.isIntersecting) return;
        pickIO.unobserve(e.target);
        paintRow(e.target);
      });
    }, { root: $('fpPickerList'), rootMargin: '250px' });
    [].forEach.call(rows, function(r){ pickIO.observe(r); });
  }

  function drawPicker(){
    var want = allowedFor(pickerSlot);
    var q = ($('fpPickerQ').value || '').trim().toLowerCase();
    var rows = ALL_FONTS.filter(function(f){
      if (want === 'en' && !f.is_english) return false;
      if (want === 'ko' && f.is_english) return false;
      if (!q) return true;
      return (f.name || '').toLowerCase().indexOf(q) >= 0
          || (f.maker || '').toLowerCase().indexOf(q) >= 0;
    });
    $('fpPickerList').innerHTML = rows.length
      ? rows.map(function(f){
          return '<div class="fp-item" data-fid="' + f.id + '"><b>' + esc(f.name) + '</b>' +
                 '<i>' + esc(f.maker || '') + '</i></div>';
        }).join('')
      : '<div class="fp-empty">찾는 폰트가 없어요.</div>';
    pickIndex = {};
    rows.forEach(function(f){ pickIndex[f.id] = f; });
    $('fpPickerList').scrollTop = 0;
    observeRows();
  }
  function choose(fid){
    var f = ALL_FONTS.filter(function(x){ return x.id === fid; })[0];
    if (!f || !pickerSlot) return;
    /* 같은 폰트가 두 슬롯에 앉으면 견본이 조합으로 안 읽힌다. 이미 다른 슬롯에
       있으면 그 슬롯과 자리를 바꾼다 — 막아 세우는 것보다 낫다. */
    SLOTS.forEach(function(k){
      if (k !== pickerSlot && S.fonts[k] && S.fonts[k].id === fid) {
        S.fonts[k] = S.fonts[pickerSlot];
      }
    });
    S.fonts[pickerSlot] = f;
    S.lock[pickerSlot] = true;    // 직접 고른 것은 새로 뽑아도 지킨다
    /* 굵기도 새 폰트에 맞춘다. S.weights 는 조합 API 가 정해 준 값이라
       폰트만 바꾸면 앞 폰트의 굵기가 그대로 남는다 — 800짜리 자리에 800이
       없는 폰트를 넣으면 faceFor 가 굵기 전용 파일을 못 찾아 대표 파일을
       1~999 범위로 깔고, 고른 굵기와 무관하게 대표 파일의 굵기가 그려진다.
       가까운 값으로 당긴다. 같은 거리면 가벼운 쪽 — 서버 pick_weight 과 같다. */
    var ws = f.available_weights || [];
    var want = S.weights[pickerSlot];
    if (ws.length && ws.indexOf(want) < 0) {
      S.weights[pickerSlot] = ws.reduce(function(a, b){
        return Math.abs(b - want) < Math.abs(a - want) ? b : a;
      });
    }
    $('fpPicker').classList.remove('open');
    renderStage(); renderSlots(); syncUrl();
  }

  // ── 이벤트 ──────────────────────────────────────────
  $('fpRoll').addEventListener('click', roll);

  $('fpScript').addEventListener('click', function(e){
    var b = e.target.closest('button[data-sc]'); if (!b) return;
    S.script = b.dataset.sc;
    [].forEach.call(this.querySelectorAll('button'), function(x){ x.classList.toggle('on', x === b); });
    /* 스크립트가 바뀌면 쓰던 폰트가 그 글자를 못 그릴 수 있다 — 전부 다시 뽑는다.
       잠금도 푼다(잠긴 폰트가 깨진 글자를 그리는 것이 더 나쁘다). */
    SLOTS.forEach(function(k){ S.lock[k] = false; });
    textEdited = false;
    roll();
  });

  $('fpCats').addEventListener('click', function(e){
    var b = e.target.closest('button[data-cat]'); if (!b) return;
    S.cat = b.dataset.cat;
    renderCats();
    textEdited = false;      // 카테고리가 바뀌면 그 카테고리의 문구로 갈아끼운다
    resetScale();            // 자리가 바뀌면 그 자리의 기본 크기에서 다시 본다
    roll();
  });

  $('fpSlots').addEventListener('click', function(e){
    var lock = e.target.closest('[data-lock]');
    if (lock) { var k = lock.dataset.lock; S.lock[k] = !S.lock[k]; renderSlots(); return; }
    var pick = e.target.closest('[data-pick]');
    if (pick) openPicker(pick.dataset.pick);
  });

  /* 레버는 끄는 동안 계속 들어온다. 슬롯을 다시 그리면 잡고 있던 손잡이가
     사라지므로, 숫자만 제자리에서 고쳐 쓴다. */
  $('fpSlots').addEventListener('input', function(e){
    var r = e.target.closest('[data-size]'); if (!r) return;
    var k = r.dataset.size;
    S.scale[k] = +r.value;
    applyScale();
    var w = r.closest('.fp-slot').querySelector('.fp-slot-w');
    if (w) w.textContent = '굵기 ' + S.weights[k] + ' · 크기 ' + Math.round(S.scale[k] * 100) + '%';
  });

  $('fpPickerQ').addEventListener('input', drawPicker);
  $('fpPickerList').addEventListener('click', function(e){
    var it = e.target.closest('[data-fid]'); if (it) choose(+it.dataset.fid);
  });
  $('fpPicker').addEventListener('click', function(e){
    if (e.target === this) this.classList.remove('open');
  });
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    $('fpPicker').classList.remove('open');
  });
  ['txtTitle','txtSub','txtBody'].forEach(function(id){
    $(id).addEventListener('input', function(){ textEdited = true; });
  });

  // ── 시작 ────────────────────────────────────────────
  var want = readUrl();
  [].forEach.call($('fpScript').querySelectorAll('button'), function(b){
    b.classList.toggle('on', b.dataset.sc === S.script);
  });

  fetch('/api/font-pair/categories')
    .then(function(r){ return r.json(); })
    .then(function(list){ CATS = list || []; renderCats(); })
    .catch(function(){})
    .then(function(){
      /* 주소에 적힌 폰트는 그대로 살려 링크를 받은 사람이 같은 화면을 보게 한다.
         잠금은 lock= 에 적힌 슬롯만 건다 — 주소에는 늘 세 폰트가 적히므로
         전부 잠그면 새로고침 한 번에 조합이 안 바뀐다. */
      var q = ['category=' + encodeURIComponent(S.cat), 'script=' + S.script];
      /* 주소에 하나도 없으면 기본 세 폰트로 연다. 하나라도 있으면 링크를 받은
         것이므로 기본값을 섞지 않는다 — 보낸 사람 화면과 달라진다. */
      var fromUrl = SLOTS.some(function(k){ return want[k]; });
      SLOTS.forEach(function(k){
        var id = fromUrl ? want[k] : (S.script === 'ko' ? DEFAULT_FONTS[k] : 0);
        if (id) q.push(k + '=' + id);
      });
      return fetch('/api/font-pair/generate?' + q.join('&'))
        .then(function(r){ return r.json(); })
        .then(function(d){
          S.fonts = d.fonts; S.weights = d.weights;
          S.family = d.family || [];
          setText(d.samples);
          renderStage(); renderSlots(); renderCats(); syncUrl();
          prefetchBackgrounds();
        });
    })
    .catch(function(){
      showErr('조합을 불러오지 못했어요. 새로고침해 주세요.');
    });
})();
</script>
</body>
</html>
