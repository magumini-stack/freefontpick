<!DOCTYPE html>
<html lang="ko">
<head>
<script>
  (function(){
    try{
      var t = localStorage.getItem('ffp-theme');
      if(t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow, max-image-preview:large">
<title>{{FFP_TITLE}}</title>
<link rel="stylesheet" href="/header.css">
<meta name="description" content="{{FFP_DESC}}">
<link rel="canonical" href="{{FFP_CANONICAL}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{FFP_TITLE}}">
<meta property="og:description" content="{{FFP_DESC}}">
<meta property="og:url" content="{{FFP_CANONICAL}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="google-adsense-account" content="ca-pub-4036975940442022">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4036975940442022"
     crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF7;--bg-card:#fff;--bg-secondary:#F3F3EF;
    --text-primary:#1A1A1A;--text-secondary:#6B6B6B;--text-muted:#9A9A9A;
    --border:rgba(0,0,0,.09);--border-hover:rgba(0,0,0,.18);
    --accent:#1E3A8A;--accent-light:#EEF2FB;--accent-hover:#16307A;
    --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
    --shadow-card:0 1px 4px rgba(0,0,0,.06);--shadow-hover:0 6px 20px rgba(0,0,0,.1);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#141414;--bg-card:#1E1E1E;--bg-secondary:#2A2A2A;
    --text-primary:#F0F0EC;--text-secondary:#A0A09A;--text-muted:#666660;
    --border:rgba(255,255,255,.1);--border-hover:rgba(255,255,255,.2);
    --accent:#5B82E0;--accent-light:#141A2A;--accent-hover:#7B9CE8;
    --shadow-card:0 1px 4px rgba(0,0,0,.3);--shadow-hover:0 6px 24px rgba(0,0,0,.4);
    color-scheme:dark;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#141414;--bg-card:#1E1E1E;--bg-secondary:#2A2A2A;
      --text-primary:#F0F0EC;--text-secondary:#A0A09A;--text-muted:#666660;
      --border:rgba(255,255,255,.1);--border-hover:rgba(255,255,255,.2);
      --accent:#5B82E0;--accent-light:#141A2A;--accent-hover:#7B9CE8;
      --shadow-card:0 1px 4px rgba(0,0,0,.3);--shadow-hover:0 6px 24px rgba(0,0,0,.4);
      color-scheme:dark;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ui:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}
  body{background:var(--bg);color:var(--text-primary);font-family:var(--ui);
       -webkit-font-smoothing:antialiased;padding-top:57px}

  .fp-wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}

  /* ── 상단 바 ───────────────────────────────────────── */
  .fp-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .fp-seg{display:inline-flex;background:var(--bg-secondary);border-radius:999px;padding:3px}
  .fp-seg button{border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;
                 color:var(--text-secondary);padding:6px 14px;border-radius:999px;cursor:pointer}
  .fp-seg button.on{background:var(--bg-card);color:var(--text-primary);box-shadow:var(--shadow-card)}
  .fp-cats{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:240px}
  .fp-chip{border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);
           font-family:inherit;font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer;
           white-space:nowrap;transition:all .13s}
  .fp-chip:hover{border-color:var(--border-hover);color:var(--text-primary)}
  .fp-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .fp-act{display:flex;gap:8px}
  .fp-btn{border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);
          font-family:inherit;font-size:13px;font-weight:600;padding:8px 15px;border-radius:8px;
          cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .fp-btn:hover{border-color:var(--border-hover)}
  .fp-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .fp-btn.primary:hover{background:var(--accent-hover)}
  .fp-btn svg{width:15px;height:15px}
  .spin svg{animation:fpspin .5s ease}
  @keyframes fpspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  /* ── 견본 = 쓰는 자리 목업 ──────────────────────────────
     고른 카테고리의 실제 자리에 조판해 "내 자리에 쓰면 어떻게 보이는가"에
     바로 답한다.

     틀은 16:9 하나로 통일했다(860×484). 자리마다 비율이 달라지면 조합이
     바뀐 건지 틀이 바뀐 건지 눈이 헷갈린다 — 비교하러 온 화면에서는 틀이
     고정이어야 폰트만 보인다. 자리 구분은 바탕색이 맡는다.

     글자 크기는 틀 폭에 비례한다(cqw). 폭이 860px이므로 1cqw = 8.6px.
     세 단은 제목 > 서브타이틀 > 본문 순으로 벌려 둔다 — 서브타이틀과 본문이
     같은 크기면 두 줄이 한 덩어리로 붙어 위계가 안 읽힌다.
     슬롯의 크기 레버가 그 위에 배수(--k-*)로 곱해진다. */
  /* stretch + 캔버스만 flex-start — 칸의 높이는 캔버스가 정하고(16:9 비율),
     오른쪽 칸이 거기 맞춰 늘어난다. 사용팁이 남는 자리를 채워
     아래끝이 캔버스 아래끝과 딱 맞는다. */
  .fp-shell{display:flex;align-items:stretch;gap:16px;padding:6px 0 2px}
  .fp-stage{container-type:inline-size;position:relative;flex:1;min-width:0;max-width:860px;
            align-self:flex-start;
            aspect-ratio:16/9;border-radius:var(--radius-md);box-shadow:var(--shadow-hover);
            overflow:hidden;background:var(--bg-card);color:var(--text-primary);
            display:flex;flex-direction:column}
  .fp-stage::after{content:attr(data-frame);position:absolute;right:10px;bottom:8px;
                   font-family:var(--ui);font-size:10.5px;letter-spacing:.05em;
                   color:currentColor;opacity:.4;pointer-events:none}

  .fp-err{margin:12px auto 0;max-width:62ch;text-align:center;font-size:13px;color:var(--text-muted)}
  .fp-text{outline:none;word-break:keep-all;white-space:pre-line}
  .fp-text:focus{outline:2px dashed currentColor;outline-offset:4px;border-radius:3px}

  #txtTitle{font-size:calc(var(--b-title,7cqw) * var(--k-title,1));line-height:1.16}
  #txtSub  {font-size:calc(var(--b-sub,3.4cqw) * var(--k-sub,1));line-height:1.45;opacity:.8}
  #txtBody {font-size:calc(var(--b-body,2.8cqw) * var(--k-body,1));line-height:1.75}

  /* 영상 · 자막 — 먹색 화면. 자막 바가 아래에 깔린다 */
  .mk-thumb{background:#15161A;color:#F5F5F2;justify-content:center;padding:7cqw 7cqw 13cqw;
            --b-title:10cqw;--b-sub:3.6cqw;--b-body:2.8cqw}
  .mk-thumb .fp-blk-body{position:absolute;left:0;right:0;bottom:0;
            background:rgba(0,0,0,.55);padding:2.4cqw 7cqw 2.8cqw;text-align:center}
  .mk-thumb #txtSub{margin-top:1.6cqw}

  /* SNS · 카드뉴스 — 따뜻한 모래색 */
  .mk-card{background:#F2E4D4;color:#2B231A;justify-content:center;padding:7cqw;
           --b-title:7.6cqw;--b-sub:3.6cqw;--b-body:3cqw}
  .mk-card #txtSub{margin-top:2cqw}
  .mk-card .fp-blk-body{margin-top:3.5cqw}

  /* 브랜딩 · 로고 — 차분한 회백. 명함처럼 아래로 붙는다 */
  .mk-namecard{background:#E9E9EC;color:#1E1E1C;justify-content:flex-end;padding:7cqw;
               --b-title:8cqw;--b-sub:3.4cqw;--b-body:2.8cqw}
  .mk-namecard #txtSub{margin-top:1.4cqw}
  .mk-namecard .fp-blk-body{margin-top:3.5cqw;opacity:.75}

  /* 포스터 · 안내 — 짙은 남색. 멀리서 읽히는지 보는 자리 */
  .mk-poster{background:#1F3350;color:#F1F4F9;justify-content:center;padding:6cqw;
             --b-title:7.6cqw;--b-sub:3.4cqw;--b-body:2.8cqw}
  .mk-poster #txtSub{margin-top:2cqw}
  .mk-poster .fp-blk-body{margin-top:3cqw}

  /* 감성 · 손글씨 — 연한 쑥빛. 가운데로 모은다 */
  .mk-note{background:#E6EDE8;color:#22302A;align-items:center;justify-content:center;
           text-align:center;padding:7cqw;
           --b-title:8cqw;--b-sub:3.5cqw;--b-body:2.9cqw}
  .mk-note #txtSub{margin-top:2cqw}
  .mk-note .fp-blk-body{margin-top:3cqw}

  /* 본문 · 읽기 — 종이 흰색. 2단으로 앉힌다.
     낮아진 틀에 2단을 넣어야 해서 본문 줄 사이만 1.6으로 좁힌다. */
  .mk-magazine{background:#FCFBF7;color:#1A1A18;padding:4.5cqw;
               --b-title:7cqw;--b-sub:3.4cqw;--b-body:2.6cqw}
  .mk-magazine #txtSub{margin-top:1cqw}
  .mk-magazine #txtBody{line-height:1.6}
  .mk-magazine .fp-blk-body{margin-top:3cqw;column-count:2;column-gap:3cqw;
               border-top:1px solid color-mix(in srgb,currentColor 18%,transparent);
               padding-top:2.4cqw}

  /* ── 오른쪽 칸: 슬롯 3개 + 쓰는 법 ─────────────────────
     캔버스 옆에 세로로 세운다. 아래에 두면 스크롤을 내려야 폰트 이름이
     보였다 — 무슨 폰트인지가 견본과 같이 보여야 한다.
     슬롯 아래로 남는 자리에 쓰는 법을 넣어 칸을 채운다. */
  .fp-side{flex:none;width:264px;display:flex;flex-direction:column;gap:12px}
  .fp-slots{display:flex;flex-direction:column;gap:10px}
  .fp-slot{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);
           padding:11px 13px 9px;display:flex;flex-direction:column;gap:8px}
  .fp-slot-top{display:flex;align-items:center;gap:11px}
  .fp-slot.locked{border-color:var(--accent);background:var(--accent-light)}
  .fp-role{width:32px;height:32px;flex:none;border-radius:8px;background:var(--bg-secondary);
           display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--text-secondary)}
  .fp-slot-main{flex:1;min-width:0}
  .fp-slot-role{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--text-muted)}
  .fp-slot-font{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
                display:block;color:inherit;text-decoration:none}
  a.fp-slot-font:hover{text-decoration:underline}
  .fp-slot-w{font-size:11px;color:var(--text-muted);font-weight:500}
  .fp-icons{display:flex;gap:2px;flex:none}
  .fp-icon{border:none;background:none;cursor:pointer;color:var(--text-muted);padding:6px;border-radius:6px;
           display:grid;place-items:center;text-decoration:none}
  .fp-icon:hover{background:var(--bg-secondary);color:var(--text-primary)}
  .fp-icon.on{color:var(--accent)}
  .fp-icon svg{width:16px;height:16px}
  /* 크기 레버 — 틀은 16:9로 고정이라 자리마다 원하는 크기가 다르다.
     기본값에 배수(--k-*)를 곱하는 방식이라 틀이 바뀌어도 비례가 유지된다.
     선은 2px까지 얇게 눕힌다. 조작이 아니라 폰트를 보러 온 화면이라
     손잡이만 보이면 된다. 눌리는 영역은 12px로 남겨 둔다. */
  .fp-size{-webkit-appearance:none;appearance:none;width:100%;height:12px;
           margin:0;background:none;cursor:pointer}
  .fp-size::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:var(--border)}
  .fp-size::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
           border-radius:50%;background:var(--accent);margin-top:-4px}
  .fp-size::-moz-range-track{height:2px;border-radius:2px;background:var(--border)}
  .fp-size::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;
           background:var(--accent)}

  /* ── 미세조정 패널 ──────────────────────────────────── */

  @media(max-width:900px){
    .fp-shell{flex-direction:column;align-items:stretch}
    .fp-stage{max-width:none}
    .fp-side{width:auto}
    .fp-about{flex:none}
    .fp-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  }
  @media(max-width:560px){
    .fp-stage{aspect-ratio:auto;min-height:340px}
    .mk-magazine .fp-blk-body{column-count:1}
  }

  /* ── 폰트 고르기 ────────────────────────────────────── */
  .fp-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:none;
            align-items:center;justify-content:center;padding:20px}
  .fp-modal.open{display:flex}
  .fp-modal-box{background:var(--bg-card);border-radius:var(--radius-lg);width:min(560px,100%);
                max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
  .fp-modal-head{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
  .fp-modal-head h2{font-size:15px;font-weight:800;margin-bottom:9px}
  .fp-modal-head input{width:100%;height:36px;border:1px solid var(--border);border-radius:8px;
                       padding:0 12px;font-family:inherit;font-size:13px;background:var(--bg-secondary);
                       color:var(--text-primary);outline:none}
  .fp-modal-head input:focus{border-color:var(--accent)}
  .fp-list{overflow-y:auto;padding:6px}
  .fp-item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;
           padding:9px 12px;border-radius:8px;cursor:pointer}
  .fp-item:hover{background:var(--bg-secondary)}
  /* 이름을 그 폰트로 그린다 — 목록에서 모양을 못 보면 고를 수가 없다.
     파일은 화면에 들어온 줄만 받는다(아래 IntersectionObserver). */
  .fp-item b{font-size:21px;font-weight:400;line-height:1.4;font-family:var(--ui)}
  .fp-item i{font-size:11.5px;color:var(--text-muted);font-style:normal;font-family:var(--ui)}
  .fp-empty{padding:22px;text-align:center;color:var(--text-muted);font-size:13px}

  /* ── 사용팁 — 오른쪽 칸 슬롯 아래 ─────────────────────── */
  .fp-about{flex:1;min-height:0;background:var(--bg-secondary);
            border-radius:var(--radius-md);padding:13px 14px}
  .fp-about h2{font-size:11.5px;font-weight:800;letter-spacing:.06em;
               color:var(--text-muted);margin-bottom:9px}
  .fp-about ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  .fp-about li{position:relative;padding-left:11px;font-size:12.5px;line-height:1.65;
               color:var(--text-secondary);word-break:keep-all}
  .fp-about li::before{content:'';position:absolute;left:0;top:8px;width:4px;height:4px;
               border-radius:50%;background:var(--text-muted);opacity:.6}
  .fp-about b{font-weight:700;color:var(--text-primary)}
  .fp-about p{font-size:12.5px;color:var(--text-secondary);line-height:1.8;
              word-break:keep-all}
</style>
</head>
<body>

<!--FFP_HEADER-->

<main class="fp-wrap">

  <div class="fp-bar">
    <div class="fp-seg" id="fpScript">
      <button type="button" data-sc="ko" class="on">한글</button>
      <button type="button" data-sc="en">영문</button>
      <button type="button" data-sc="mix">혼합</button>
    </div>
    <div class="fp-cats" id="fpCats"></div>
    <div class="fp-act">
      <button type="button" class="fp-btn primary" id="fpRoll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
        조합 새로고침
      </button>
    </div>
  </div>

  <div class="fp-shell">
    <section class="fp-stage mk-card" id="fpStage" data-frame="">
      <div class="fp-blk-title">
        <h1 class="fp-text" id="txtTitle" contenteditable="true" spellcheck="false"></h1>
      </div>
      <div class="fp-blk-sub">
        <p class="fp-text" id="txtSub" contenteditable="true" spellcheck="false"></p>
      </div>
      <div class="fp-blk-body">
        <div class="fp-text" id="txtBody" contenteditable="true" spellcheck="false"></div>
      </div>
    </section>

    <aside class="fp-side">
      <section class="fp-slots" id="fpSlots"></section>
      {{FFP_PAIR_SSR}}
    </aside>
  </div>

  <p class="fp-err" id="fpErr" hidden></p>

</main>


<div class="fp-modal" id="fpPicker">
  <div class="fp-modal-box">
    <div class="fp-modal-head">
      <h2 id="fpPickerTitle">폰트 고르기</h2>
      <input type="text" id="fpPickerQ" placeholder="폰트명 또는 제작사로 찾기" autocomplete="off">
    </div>
    <div class="fp-list" id="fpPickerList"></div>
  </div>
</div>

<script src="/static/ffp-fontface.js"></script>
<script>
(function(){
  'use strict';

  var SLOTS = ['title', 'subtitle', 'body'];
  var ROLE  = { title: '타이틀', subtitle: '서브타이틀', body: '본문' };
  var ABBR  = { title: 'H1', subtitle: 'Aa', body: 'T' };
  var VAR   = { title: 'title', subtitle: 'sub', body: 'body' };   // CSS 변수 접미사

  var S = {
    cat: 'brand',
    script: 'ko',
    fonts:   { title: null, subtitle: null, body: null },
    weights: { title: 700, subtitle: 500, body: 400 },
    lock:    { title: false, subtitle: false, body: false },
    scale:   { title: 1, subtitle: 1, body: 1 },   // 슬롯 크기 레버 배수
    borrow:  ''          // '뜻밖의 발견'이 어느 틀을 빌렸는지 (주소로 재현하려면 필요)
  };

  var CATS = [];
  var ALL_FONTS = null;      // 폰트 고르기 목록 (한 번만 받는다)
  var pickerSlot = null;

  function $(id){ return document.getElementById(id); }
  function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

  // ── 주소 ────────────────────────────────────────────
  /* 조합과 조정값을 주소에 담는다. 기본값인 항목은 빼서 주소를 짧게 둔다.
     갱신은 replaceState — 슬라이더를 움직일 때마다 히스토리가 쌓이면
     뒤로가기가 망가진다. */
  function syncUrl(){
    var q = [];
    if (S.cat !== 'brand') q.push('cat=' + S.cat);
    if (S.script !== 'ko') q.push('sc=' + S.script);
    SLOTS.forEach(function(k, i){
      if (S.fonts[k]) q.push(['t','s','b'][i] + '=' + S.fonts[k].id);
    });
    var url = location.pathname + (q.length ? '?' + q.join('&') : '');
    if (url !== location.pathname + location.search) history.replaceState(null, '', url);
  }
  function readUrl(){
    var p = new URLSearchParams(location.search);
    if (p.get('cat')) S.cat = p.get('cat');
    if (p.get('sc'))  S.script = p.get('sc');
    return { title: +p.get('t') || 0, subtitle: +p.get('s') || 0, body: +p.get('b') || 0 };
  }

  // ── 그리기 ──────────────────────────────────────────
  /* 목업 틀 이름 → 화면 라벨. 틀 구석에 작게 적어 둔다 —
     지금 무엇을 보고 있는지가 화면에서 읽혀야 한다. */
  /* 틀이 전부 가로형이라 치수를 적으면 거짓말이 된다. 대신 어느 자리를
     보고 있는지를 적는다 — '뜻밖의 발견'은 틀을 빌려 쓰므로 특히 필요하다. */
  var FRAME_LABEL = { thumb:'영상 · 자막', card:'SNS · 카드뉴스',
                      namecard:'브랜딩 · 로고', poster:'포스터 · 안내',
                      note:'감성 · 손글씨', magazine:'본문 · 읽기' };
  function applyMockup(name){
    var st = $('fpStage');
    st.className = 'fp-stage mk-' + (name || 'card');
    st.setAttribute('data-frame', FRAME_LABEL[name] || '');
  }

  /* 크기 레버 — 기본 크기(--b-*)에 배수(--k-*)를 곱한다. 값을 직접 px로
     쓰지 않는 이유는 틀이 바뀌어도 비례가 유지돼야 하기 때문이다. */
  function applyScale(){
    var st = $('fpStage');
    SLOTS.forEach(function(k){ st.style.setProperty('--k-' + VAR[k], S.scale[k]); });
  }
  function resetScale(){
    SLOTS.forEach(function(k){ S.scale[k] = 1; });
    applyScale();
  }

  function renderStage(){
    SLOTS.forEach(function(k){
      var f = S.fonts[k];
      if (!f) return;
      /* stack과 weight를 한 쌍으로 받아 그대로 적는다 — 그 굵기의 파일이 직접
         그리는 경우에 CSS로 굵기를 또 요구하면 가짜 볼드가 덧씌워진다. */
      var face = FFPFont.faceFor(f, S.weights[k]);
      var el = $({ title: 'txtTitle', subtitle: 'txtSub', body: 'txtBody' }[k]);
      el.style.fontFamily = face.stack;
      el.style.fontWeight = face.weight;
    });
  }

  function renderSlots(){
    $('fpSlots').innerHTML = SLOTS.map(function(k){
      var f = S.fonts[k];
      if (!f) return '';
      return '<div class="fp-slot' + (S.lock[k] ? ' locked' : '') + '" data-slot="' + k + '">' +
        '<div class="fp-slot-top">' +
        '<div class="fp-role">' + ABBR[k] + '</div>' +
        '<div class="fp-slot-main">' +
          '<div class="fp-slot-role">' + ROLE[k] + '</div>' +
          '<a class="fp-slot-font" href="/font/' + f.id + '" title="' + esc(f.name) +
            ' 상세페이지 — 다운로드 · 라이선스">' + esc(f.name) + '</a>' +
          '<div class="fp-slot-w">굵기 ' + S.weights[k] +
            ' · 크기 ' + Math.round(S.scale[k] * 100) + '%</div>' +
        '</div>' +
        '<div class="fp-icons">' +
          '<button type="button" class="fp-icon' + (S.lock[k] ? ' on' : '') + '" data-lock="' + k +
            '" title="' + (S.lock[k] ? '잠금 해제' : '이 슬롯 고정 — 새로 뽑아도 안 바뀝니다') + '">' +
            (S.lock[k]
              ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
              : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>') +
          '</button>' +
          '<button type="button" class="fp-icon" data-pick="' + k + '" title="폰트 직접 고르기">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>' +
          '</button>' +
          '<a class="fp-icon" href="/font/' + f.id + '" title="' + esc(f.name) + ' 상세페이지 — 다운로드 · 라이선스">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
          '</a>' +
        '</div></div>' +
        '<input type="range" class="fp-size" data-size="' + k + '" min="0.6" max="1.7" ' +
          'step="0.05" value="' + S.scale[k] + '" aria-label="' + ROLE[k] + ' 크기">' +
        '</div>';
    }).join('');
  }

  function renderCats(){
    $('fpCats').innerHTML = CATS.map(function(c){
      return '<button type="button" class="fp-chip' + (c.key === S.cat ? ' on' : '') +
             '" data-cat="' + c.key + '">' + esc(c.label) + '</button>';
    }).join('');
  }

  // ── 조합 받아오기 ───────────────────────────────────
  function showErr(msg){
    var e = $('fpErr');
    e.textContent = msg || '';
    e.hidden = !msg;
  }

  var rolling = false;
  function roll(){
    if (rolling) return;
    rolling = true;
    var btn = $('fpRoll');
    btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin');

    var q = ['category=' + encodeURIComponent(S.cat), 'script=' + S.script];
    SLOTS.forEach(function(k){
      if (S.lock[k] && S.fonts[k]) q.push(k + '=' + S.fonts[k].id);
    });
    // 틀을 빌려 쓰는 카테고리는 계속 같은 틀을 유지한다. 새로 뽑을 때마다
    // 틀까지 바뀌면 폰트가 달라진 건지 자리가 달라진 건지 알 수 없다.
    if (S.borrow) q.push('borrow=' + S.borrow);
    fetch('/api/font-pair/generate?' + q.join('&'))
      .then(function(r){ if (!r.ok) throw new Error('generate'); return r.json(); })
      .then(function(d){
        S.fonts = d.fonts;
        S.weights = d.weights;
        setText(d.samples);
        showErr('');
        renderStage(); renderSlots(); syncUrl();
      })
      .catch(function(){
        /* 실패해도 화면을 비우지 않는다 — 보고 있던 조합이 사라지면 더 나쁘다 */
        showErr('조합을 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.');
      })
      .then(function(){ rolling = false; });
  }

  /* 문구는 사용자가 고쳐 쓸 수 있다. 고쳐 쓴 뒤에는 조합을 새로 뽑아도
     그 문구를 지키고, 카테고리를 바꿀 때만 새 문구로 갈아끼운다. */
  var textEdited = false;
  function setText(samples){
    /* 틀은 문구를 고쳐 썼더라도 항상 갈아끼운다 — 카테고리가 바뀌면 자리가
       바뀌는 것이지 글만 바뀌는 것이 아니다. */
    applyMockup(samples.mockup);
    S.borrow = samples.borrowed || '';
    if (textEdited) return;
    $('txtTitle').textContent = samples.title;
    $('txtSub').textContent   = samples.subtitle;
    $('txtBody').textContent  = samples.body;
  }

  // ── 미세조정 패널 ───────────────────────────────────
  // ── 폰트 고르기 ─────────────────────────────────────
  /* 스크립트 규칙을 화면에서도 지킨다 — 영문 전용 폰트에 한글 문구를 얹으면
     글리프가 없어 통째로 깨진다(서버의 _script_pools와 같은 규칙). */
  function allowedFor(slot){
    if (S.script === 'en') return 'en';
    if (S.script === 'mix') return slot === 'title' ? 'en' : 'ko';
    return 'ko';
  }
  function openPicker(slot){
    pickerSlot = slot;
    $('fpPickerTitle').textContent = ROLE[slot] + ' 폰트 고르기';
    $('fpPickerQ').value = '';
    $('fpPicker').classList.add('open');
    $('fpPickerQ').focus();
    /* 늘 맨 위에서 시작한다 — 지난번에 보던 자리에 그대로 서 있으면
       목록을 새로 여는 것인지 이어 보는 것인지 알 수 없다. */
    $('fpPickerList').scrollTop = 0;
    if (ALL_FONTS) { drawPicker(); return; }
    $('fpPickerList').innerHTML = '<div class="fp-empty">불러오는 중…</div>';
    fetch('/api/fonts').then(function(r){ return r.json(); }).then(function(list){
      ALL_FONTS = list || []; drawPicker();
    }).catch(function(){
      $('fpPickerList').innerHTML = '<div class="fp-empty">폰트 목록을 불러오지 못했어요.</div>';
    });
  }
  /* 목록의 폰트 파일은 화면에 들어온 줄만 받는다. 한글 폰트만 180종이라
     한 번에 다 받으면 목록이 뜨기까지 한참 걸린다. */
  var pickIO = null, pickIndex = {};
  function paintRow(row){
    var f = pickIndex[row.dataset.fid];
    if (!f) return;
    if (f.webfont_family && f.file_source !== 'user') FFPFont.resolveWebfont(f);
    else FFPFont.ensureFont(f);
    var nm = row.querySelector('b');
    if (nm) nm.style.fontFamily = FFPFont.stackOf(f);
  }
  function observeRows(){
    if (pickIO) pickIO.disconnect();
    var rows = $('fpPickerList').querySelectorAll('[data-fid]');
    if (!('IntersectionObserver' in window)) {
      [].forEach.call(rows, paintRow);
      return;
    }
    pickIO = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if (!e.isIntersecting) return;
        pickIO.unobserve(e.target);
        paintRow(e.target);
      });
    }, { root: $('fpPickerList'), rootMargin: '250px' });
    [].forEach.call(rows, function(r){ pickIO.observe(r); });
  }

  function drawPicker(){
    var want = allowedFor(pickerSlot);
    var q = ($('fpPickerQ').value || '').trim().toLowerCase();
    var rows = ALL_FONTS.filter(function(f){
      if (want === 'en' && !f.is_english) return false;
      if (want === 'ko' && f.is_english) return false;
      if (!q) return true;
      return (f.name || '').toLowerCase().indexOf(q) >= 0
          || (f.maker || '').toLowerCase().indexOf(q) >= 0;
    });
    $('fpPickerList').innerHTML = rows.length
      ? rows.map(function(f){
          return '<div class="fp-item" data-fid="' + f.id + '"><b>' + esc(f.name) + '</b>' +
                 '<i>' + esc(f.maker || '') + '</i></div>';
        }).join('')
      : '<div class="fp-empty">찾는 폰트가 없어요.</div>';
    pickIndex = {};
    rows.forEach(function(f){ pickIndex[f.id] = f; });
    $('fpPickerList').scrollTop = 0;
    observeRows();
  }
  function choose(fid){
    var f = ALL_FONTS.filter(function(x){ return x.id === fid; })[0];
    if (!f || !pickerSlot) return;
    /* 같은 폰트가 두 슬롯에 앉으면 견본이 조합으로 안 읽힌다. 이미 다른 슬롯에
       있으면 그 슬롯과 자리를 바꾼다 — 막아 세우는 것보다 낫다. */
    SLOTS.forEach(function(k){
      if (k !== pickerSlot && S.fonts[k] && S.fonts[k].id === fid) {
        S.fonts[k] = S.fonts[pickerSlot];
      }
    });
    S.fonts[pickerSlot] = f;
    S.lock[pickerSlot] = true;    // 직접 고른 것은 새로 뽑아도 지킨다
    $('fpPicker').classList.remove('open');
    renderStage(); renderSlots(); syncUrl();
  }

  // ── 이벤트 ──────────────────────────────────────────
  $('fpRoll').addEventListener('click', roll);

  $('fpScript').addEventListener('click', function(e){
    var b = e.target.closest('button[data-sc]'); if (!b) return;
    S.script = b.dataset.sc;
    [].forEach.call(this.querySelectorAll('button'), function(x){ x.classList.toggle('on', x === b); });
    /* 스크립트가 바뀌면 쓰던 폰트가 그 글자를 못 그릴 수 있다 — 전부 다시 뽑는다.
       잠금도 푼다(잠긴 폰트가 깨진 글자를 그리는 것이 더 나쁘다). */
    SLOTS.forEach(function(k){ S.lock[k] = false; });
    textEdited = false;
    roll();
  });

  $('fpCats').addEventListener('click', function(e){
    var b = e.target.closest('button[data-cat]'); if (!b) return;
    S.cat = b.dataset.cat;
    renderCats();
    textEdited = false;      // 카테고리가 바뀌면 그 카테고리의 문구로 갈아끼운다
    resetScale();            // 자리가 바뀌면 그 자리의 기본 크기에서 다시 본다
    roll();
  });

  $('fpSlots').addEventListener('click', function(e){
    var lock = e.target.closest('[data-lock]');
    if (lock) { var k = lock.dataset.lock; S.lock[k] = !S.lock[k]; renderSlots(); return; }
    var pick = e.target.closest('[data-pick]');
    if (pick) openPicker(pick.dataset.pick);
  });

  /* 레버는 끄는 동안 계속 들어온다. 슬롯을 다시 그리면 잡고 있던 손잡이가
     사라지므로, 숫자만 제자리에서 고쳐 쓴다. */
  $('fpSlots').addEventListener('input', function(e){
    var r = e.target.closest('[data-size]'); if (!r) return;
    var k = r.dataset.size;
    S.scale[k] = +r.value;
    applyScale();
    var w = r.parentNode.querySelector('.fp-slot-w');
    if (w) w.textContent = '굵기 ' + S.weights[k] + ' · 크기 ' + Math.round(S.scale[k] * 100) + '%';
  });

  $('fpPickerQ').addEventListener('input', drawPicker);
  $('fpPickerList').addEventListener('click', function(e){
    var it = e.target.closest('[data-fid]'); if (it) choose(+it.dataset.fid);
  });
  $('fpPicker').addEventListener('click', function(e){
    if (e.target === this) this.classList.remove('open');
  });
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    $('fpPicker').classList.remove('open');
  });
  ['txtTitle','txtSub','txtBody'].forEach(function(id){
    $(id).addEventListener('input', function(){ textEdited = true; });
  });

  // ── 시작 ────────────────────────────────────────────
  var want = readUrl();
  [].forEach.call($('fpScript').querySelectorAll('button'), function(b){
    b.classList.toggle('on', b.dataset.sc === S.script);
  });

  fetch('/api/font-pair/categories')
    .then(function(r){ return r.json(); })
    .then(function(list){ CATS = list || []; renderCats(); })
    .catch(function(){})
    .then(function(){
      /* 주소에 적힌 폰트는 그대로 살려 링크를 받은 사람이 같은 화면을 보게 한다.
         다만 잠그지는 않는다 — 주소에는 늘 세 폰트가 적히므로 잠그면
         새로고침 한 번에 전부 잠긴 채 열려 조합이 안 바뀐다. */
      var q = ['category=' + encodeURIComponent(S.cat), 'script=' + S.script];
      SLOTS.forEach(function(k){ if (want[k]) q.push(k + '=' + want[k]); });
      return fetch('/api/font-pair/generate?' + q.join('&'))
        .then(function(r){ return r.json(); })
        .then(function(d){
          S.fonts = d.fonts; S.weights = d.weights;
          setText(d.samples);
          renderStage(); renderSlots(); renderCats(); syncUrl();
        });
    })
    .catch(function(){
      showErr('조합을 불러오지 못했어요. 새로고침해 주세요.');
    });
})();
</script>
</body>
</html>
