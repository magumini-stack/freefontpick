<!--
  텍스트 디자인 — /text-design (2026-10-21 사이트에 올림, app/routers/text_design.py).
  원본은 Desktop\projects\폰트픽\글자이미지_시안\template.html — 거기서 고치고 build.py → publish.py 로
  이 파일을 갈아 끼운다(이 파일을 직접 고치면 다음 publish 때 덮인다). 추천 꾸밈의 근거는 그 폴더 조사노트.md.
  폰트 상세페이지의 '이 폰트로 디자인하기' 모달은 이 페이지를 ?font=ID&embed 로 띄운다(글씨 고정·머리글·광고 없음).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;--bg-card:#fff;--bg-secondary:#F5F5F3;--bg-sunk:#FAFAF8;
    --text-primary:#1A1A1A;--text-secondary:#6B6B6B;--text-muted:#9A9A9A;
    --border:rgba(0,0,0,.09);--border-hover:rgba(0,0,0,.18);
    --accent:#1E3A8A;--accent-light:#EEF2FB;--accent-hover:#16307A;
    --chk-a:#FFFFFF;--chk-b:#EDEDEA;--chk-da:#2A2D33;--chk-db:#22252A;
    --ui:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#141414;--bg-card:#1E1E1E;--bg-secondary:#2A2A2A;--bg-sunk:#191919;
    --text-primary:#F0F0EC;--text-secondary:#A0A09A;--text-muted:#77776F;
    --border:rgba(255,255,255,.1);--border-hover:rgba(255,255,255,.22);
    --accent:#5B82E0;--accent-light:#141A2A;--accent-hover:#7B9CE8;
    --chk-a:#2B2B2B;--chk-b:#242424;
    color-scheme:dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141414;--bg-card:#1E1E1E;--bg-secondary:#2A2A2A;--bg-sunk:#191919;
      --text-primary:#F0F0EC;--text-secondary:#A0A09A;--text-muted:#77776F;
      --border:rgba(255,255,255,.1);--border-hover:rgba(255,255,255,.22);
      --accent:#5B82E0;--accent-light:#141A2A;--accent-hover:#7B9CE8;
      --chk-a:#2B2B2B;--chk-b:#242424;
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  /* 사이트: 광고 칸은 테두리 없이(빈 칸이면 header.css 가 통째로 숨긴다) */
  .ad.ffp-ad{border:0;display:block;min-height:0}
  /* 상세페이지 모달 안(?embed) — 첫머리·머리글 자리·광고를 감추고 위 여백을 줄인다. 폰트 고정(?font=)이면 폰트 줄도 감춘다 */
  .embed .mockbar,.embed .intro,.embed .ad{display:none!important}
  .embed .wrap{padding-top:16px}
  .embed body{padding-top:0}   /* 사이트 header.css 는 고정 머리글 자리로 body 위 60px 를 비운다 — 모달 안엔 머리글이 없다 */
  .lock #fontRow{display:none}   /* .fmore·.sw 처럼 display 를 정한 칸도 hidden 이면 숨긴다 — 없어서 폰트 목록·빛 색이 늘 펼쳐져 보였다 */
  body{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--ui);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font-family:inherit}

  .mockbar{border-bottom:1px solid var(--border);padding:14px 20px;font-weight:900;font-size:18px}
  .mockbar small{font-weight:500;font-size:12px;color:var(--text-muted);margin-left:8px}

  .wrap{max-width:1400px;margin:0 auto;padding:30px 32px 80px}
  /* 첫머리 — 폰트 찾기·폰트 변환·추천 폰트 자판기의 첫머리와 같은 모양(가운데, 꼬리표 → 큰 제목 → 18px 회색 설명) */
  .intro{text-align:center;margin:0 auto;padding:14px 0 28px;font-size:16px}
  .intro .eyebrow{display:inline-flex;align-items:center;gap:5px;color:var(--text-primary)}
  .intro .eyebrow svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .intro .hero-title{font-size:clamp(21px,3.1vw,32px);font-weight:800;color:var(--text-primary);line-height:1.32;letter-spacing:-.8px;margin:0;word-break:keep-all}
  .intro .lead{margin:6px 0 0;font-size:18px;line-height:1.6;color:var(--text-secondary);word-break:keep-all}
  .m-br{display:none}
  @media(max-width:768px){.intro .hero-title{font-size:22px}}
  @media(max-width:640px){.intro{padding:6px 0 20px}.intro .lead{font-size:16px}.m-br{display:inline}}

  /* 1. 용도 */
  .uses{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .use{border:1px solid var(--border);background:var(--bg-card);border-radius:999px;padding:9px 16px;font-size:15px;font-weight:600;
    color:var(--text-primary);cursor:pointer}
  .use:hover{border-color:var(--border-hover)}
  .use[aria-pressed="true"]{background:var(--text-primary);color:var(--bg);border-color:var(--text-primary)}

  /* 2. 문구 */
  .txtbox{position:relative}
  .txt{width:100%;resize:none;border:1.5px solid var(--border-hover);border-radius:14px;background:var(--bg-card);color:var(--text-primary);
    font:600 20px/1.45 var(--ui);padding:14px 16px;outline:none;min-height:58px}
  .txt:focus{border-color:var(--accent)}
  .hint{font-size:12.5px;color:var(--text-muted);margin:8px 2px 0}

  /* 3. 결과 */
  /* 2026-10-21 사용자님 "템플릿을 왼쪽에, 더 꾸미기를 오른쪽에" — 세 칸: 추천 꾸밈 | 문구·미리보기·저장 | 더 꾸미기(늘 펼침) */
  .top{grid-area:top}
  .work{display:grid;grid-template-columns:268px minmax(0,1fr) 320px;grid-template-rows:auto auto auto 1fr;
    grid-template-areas:"recs top more" "recs stage more" "recs act more" "recs ad more";gap:18px 26px;align-items:start}
  /* 세 칸 바닥 맞추기 — 10/21 사용자님 "추천 꾸밈 맨 아래·더 꾸미기 맨 아래·광고 하단이 같은 라인" */
  .recs,.more{align-self:stretch}
  .ad{align-self:stretch}   /* 광고는 안내 아래부터 바닥선까지 채운다(10/21 사용자님) */
  /* 양옆 칸은 페이지와 함께 통으로 움직인다(칸 안 스크롤 없음) — 10/21 사용자님 "스크롤 없게 그냥 통으로" */
  .stage{grid-area:stage;border-radius:16px;border:1px solid var(--border);min-height:340px;display:flex;align-items:center;justify-content:center;
    padding:28px;overflow:hidden;
    background-color:var(--chk-a);
    background-image:linear-gradient(45deg,var(--chk-b) 25%,transparent 25%,transparent 75%,var(--chk-b) 75%),
                     linear-gradient(45deg,var(--chk-b) 25%,transparent 25%,transparent 75%,var(--chk-b) 75%);
    background-size:20px 20px;background-position:0 0,10px 10px}
  .stage.dark{--chk-a:#2A2D33;--chk-b:#22252A}
  .stage canvas{max-width:100%;max-height:320px;height:auto;display:block}

  .act{grid-area:act}
  .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{border:1px solid var(--border-hover);background:var(--bg-card);color:var(--text-primary);border-radius:12px;padding:13px 20px;
    font-size:16px;font-weight:700;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1;min-width:180px}
  .btn.primary:hover{background:var(--accent-hover)}
  .size{display:inline-flex;border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .size button{border:0;background:transparent;color:var(--text-secondary);padding:12px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .size button[aria-pressed="true"]{background:var(--bg-secondary);color:var(--text-primary)}
  .note{font-size:13px;color:var(--text-muted);margin:10px 2px 0;line-height:1.6}
  .note a{color:var(--text-secondary)}
  .note .ln{display:block}
  .toast{font-size:13px;color:var(--accent);margin:8px 2px 0;min-height:1.2em}

  .recs{grid-area:recs;display:flex;flex-direction:column}
  .h2{font-size:15px;font-weight:800;color:var(--text-primary);margin:2px 2px 12px}
  .h2 small{font-size:12.5px;font-weight:500;color:var(--text-muted);margin-left:6px}
  .reclist{display:flex;flex-direction:column;gap:8px;flex:1}
  .reclist .rec{flex:1 1 auto;display:flex;flex-direction:column}   /* 남는 높이를 카드끼리 똑같이 */
  .reclist .rec .pv{flex:1 1 auto}
  .rec{display:grid;grid-template-columns:1fr;border:1.5px solid var(--border);border-radius:14px;background:var(--bg-card);cursor:pointer;
    padding:0;overflow:hidden;text-align:left;color:var(--text-primary)}
  .rec:hover{border-color:var(--border-hover)}
  .rec[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light)}
  /* 추천 꾸밈 카드 바탕은 늘 흰색 — 검정 바탕 카드가 섞이면 저장 그림에도 검정이 들어가는 줄 안다(10/21 사용자님) */
  .rec .pv{height:84px;display:flex;align-items:center;justify-content:center;padding:8px 12px;background:#fff;border-bottom:1px solid var(--border)}
  .rec .pv canvas{max-width:100%;max-height:66px;display:block}
  .rec .cap{display:flex;justify-content:space-between;gap:8px;padding:7px 12px 8px;font-size:13px}
  .rec .cap b{font-weight:700}
  .rec .cap span{color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 더 꾸미기 */
  .more{grid-area:more;border:1px solid var(--border);border-radius:14px;background:var(--bg-card)}
  .more summary{list-style:none;cursor:pointer;padding:14px 16px;font-size:15px;font-weight:700;display:flex;justify-content:space-between}
  .more summary::-webkit-details-marker{display:none}
  .more summary::after{content:'＋';color:var(--text-muted)}
  .more[open] summary::after{content:'－'}
  @media (min-width:861px){
    /* PC 에서는 늘 펼쳐 둔다 — 접고 펴는 단추 대신 제목만 */
    .more summary{pointer-events:none;padding-bottom:10px}
    .more summary::after,.more[open] summary::after{content:none}
  }
  .ctl{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
  .row label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);letter-spacing:.04em;margin-bottom:6px}
  /* 단추 줄 — 칸을 똑같이 나눈 한 줄(단추 수와 상관없이 줄바꿈 없음) */
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
  .seg button{border:1px solid var(--border);background:transparent;color:var(--text-secondary);border-radius:8px;padding:7px 2px;font-size:12.5px;
    font-weight:600;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;cursor:pointer}
  .seg button[aria-pressed="true"]{border-color:var(--text-primary);color:var(--text-primary);background:var(--bg-secondary)}
  /* 색 줄 — 12칸 한 줄(견본 최대 11 + 팔레트) */
  .sw{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px}
  .sw button{width:100%;aspect-ratio:1;border-radius:50%;border:1px solid var(--border-hover);cursor:pointer;padding:0}
  .sw button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
  /* 색 줄 끝 — 팔레트(직접 고르기, 스포이트는 색상표 안에 있다) */
  .sw .pal{position:relative;width:100%;aspect-ratio:1;border-radius:50%;border:1px solid var(--border-hover);cursor:pointer;flex:none;
    background:conic-gradient(#ff3b3b,#ffd400,#3ce05a,#22d3ee,#2f7bff,#a855f7,#ff3b3b)}
  .sw .pal input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
  .sw .pal[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
  .sw .pal[aria-pressed="true"]::after{content:'';position:absolute;inset:26%;border-radius:50%;background:var(--cur);box-shadow:0 0 0 2px #fff}
  input[type=range]{width:100%;accent-color:var(--accent)}
  /* 자간·줄 간격 밀대 — 이름 | 밀대 | 값 */
  .sl{display:grid;grid-template-columns:44px minmax(0,1fr) 38px;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--text-secondary)}
  .sl output{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-primary)}
  #amt{margin-top:8px}
  /* 폰트 더보기 — 그 쓸 곳에 폰트픽이 추천한 나머지 폰트, 이름을 그 폰트로 그린다 */
  .morebtn{margin-top:8px;width:100%;border:1px solid var(--border-hover);border-radius:9px;background:transparent;color:var(--text-primary);
    padding:9px 10px;font:600 13px var(--ui);cursor:pointer;display:flex;justify-content:space-between}
  .morebtn::after{content:'＋';color:var(--text-muted)}
  .morebtn[aria-expanded="true"]::after{content:'－'}
  .fmore{display:flex;flex-direction:column;margin-top:6px;max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:4px}
  .fmore button{border:0;background:transparent;text-align:left;padding:8px 10px;font-size:19px;line-height:1.3;cursor:pointer;color:var(--text-primary);
    border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:42px}
  .fmore button:hover{background:var(--bg-secondary)}
  .fmore button[aria-pressed="true"]{background:var(--accent-light);color:var(--accent)}
  .reset{align-self:flex-start;border:0;background:transparent;color:var(--text-muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:0}

  /* 광고 — 가운데 칸 저장 단추 아래(추천 꾸밈과 더 꾸미기 사이), 일반 가로형 띠(PC 728×90 꼴 · 휴대폰 320×100 꼴) */
  .ad{grid-area:ad;border:1px dashed var(--border-hover);border-radius:12px;min-height:90px;display:flex;align-items:center;justify-content:center;
    color:var(--text-muted);font-size:13px}

  /* 1440 아래 — 쓸 곳 단추가 한 줄에 들어가고 저장 단추가 첫 화면 안에 보이게 줄인다 */
  @media (max-width:1440px) and (min-width:861px){
    .work{grid-template-columns:240px minmax(0,1fr) 320px}
    .use{font-size:14px;padding:8px 13px}
    .uses{gap:6px}
    .stage{min-height:290px}
    .stage canvas{max-height:270px}
  }
  /* 노트북 폭 — 더 꾸미기는 가운데 칸 아래로 */
  @media (max-width:1180px) and (min-width:861px){
    .work{grid-template-columns:248px minmax(0,1fr);grid-template-rows:auto;
      grid-template-areas:"recs top" "recs stage" "recs act" "recs ad" "recs more"}
  }
  @media (max-width:860px){
    .wrap{padding:24px 16px 60px}
    .uses{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
    .uses::-webkit-scrollbar{display:none}
    .use{flex:none;font-size:14px;padding:8px 14px}
    .txt{font-size:18px}
    .work{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"top" "stage" "recs" "act" "ad" "more";gap:14px}

function fam(id, w){ return 'TI-' + id + '-' + (w || 0); }
function ensure(id, w){
  const key = fam(id, w);
  if (loaded.has(key)) return loaded.get(key);
  const f = byId.get(id);
  const url = ORIGIN + '/api/fonts/' + id + '/file/' + (w || 0) + (f && f[2] ? '.v' + f[2] : '') + '.woff2';
  const p = new FontFace(key, 'url(' + url + ')').load()

function applyShadow(x, name, color, u){
  x.shadowColor = 'transparent'; x.shadowBlur = 0; x.shadowOffsetX = 0; x.shadowOffsetY = 0;
  if (name === 'glow') { x.shadowColor = color; x.shadowBlur = 26 * u; return; }

   3. 자동 강조 — 조사한 썸네일·상세페이지에서 강조가 들어가는 자리 순서대로:
      가. 숫자(+단위)와 따옴표 낱말   (명작 [1위], 단 하루 특가 [40%], 반등은 ['이때'] 입니다)

const NUM_RE = /\d[\d,.]*\s?(?:%|퍼센트|만\s?원|원|억|만|천|년|개월|달|주|일|시간|시|분|초|위|등|번|개|가지|명|배|kg|살|회|탄|차|층)?/g;   // 긴 단위를 앞에(시간 → 시)
const QUOTE_RE = /['‘"“「『][^'‘’"“”」』\n]{1,20}['’"”」』]/g;

function layoutText(text, auto, wrapAt){
  const chars = [], flags = [];
  let inB = false, manual = false;
  for (const ch of Array.from(String(text || ' '))) {
    if (ch === '[') { inB = true; manual = true; continue; }
    if (ch === ']' && inB) { inB = false; continue; }
    chars.push(ch); flags.push(inB);
  }
  let lines = [], cur = { c: [], f: [] };
  chars.forEach((ch, i) => {
    if (ch === '\n') { lines.push(cur); cur = { c: [], f: [] }; }
    else { cur.c.push(ch); cur.f.push(flags[i]); }
  });
  lines.push(cur);
  lines = lines.filter((l, i) => l.c.join('').trim() || i === 0).slice(0, 3);
  if (lines.length === 1 && wrapAt) lines = wrapLine(lines[0], wrapAt);
  if (!manual && auto) autoMark(lines);
  return lines.map(l => {
    const runs = [];
    l.c.forEach((ch, i) => {
      const last = runs[runs.length - 1];
      if (last && last.hl === l.f[i]) last.t += ch; else runs.push({ t: ch, hl: l.f[i] });
    });
    return runs.length ? runs : [{ t: ' ', hl: false }];
  });
}
// 줄 길이는 눈에 보이는 폭으로 잰다 — 한글 1, 영문·숫자 0.55, 띄어쓰기 0.3
function vlen(s){ let n = 0; for (const ch of s) n += ch === ' ' ? 0.3 : /[!-~]/.test(ch) ? 0.55 : 1; return n; }
function wrapLine(l, n){
  const s = l.c.join('');
  const W = vlen(s);
  if (W <= n) return [l];
  const sp = [];
  for (let i = 0; i < s.length; i++) if (s[i] === ' ') sp.push(i);
  if (!sp.length) return [l];
  const parts = W > n * 2.2 && sp.length >= 2 ? 3 : 2;
  const cuts = [];
  for (let k = 1; k < parts; k++) {
    const target = W * k / parts;
    let best = -1, bd = 1e9;
    sp.forEach(i => { if (cuts.includes(i)) return; const d = Math.abs(vlen(s.slice(0, i)) - target); if (d < bd) { bd = d; best = i; } });
    cuts.push(best);
  }
  cuts.sort((a, b) => a - b);
  const out = [];
  let st = 0;
  cuts.concat([s.length]).forEach(e => { out.push({ c: l.c.slice(st, e), f: l.f.slice(st, e) }); st = e + 1; });
  return out.filter(x => x.c.join('').trim());
}
function markRange(l, a, b){ for (let i = a; i < b; i++) l.f[i] = true; }
function autoMark(lines){
  const ink = s => s.replace(/\s/g, '').length;
  const all = ink(lines.map(l => l.c.join('')).join(''));
  // 가. 숫자·따옴표
  let hit = false;
  lines.forEach(l => {
    const s = l.c.join('');
    [NUM_RE, QUOTE_RE].forEach(re => {
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(s))) {
        let a = m.index, b = a + m[0].length;
        while (b > a && s[b - 1] === ' ') b--;
        if (b > a && ink(s.slice(a, b)) < all) { markRange(l, a, b); hit = true; }
        if (m[0].length === 0) re.lastIndex++;
      }
    });
  });
  if (hit) return;
  const l = lines[lines.length - 1], s = l.c.join('');
  const words = [];
  s.replace(/\S+/g, (w, i) => { words.push([i, i + w.length]); return w; });
  if (!words.length) return;
  // 나. 여러 줄 — 마지막 줄이 짧으면 줄 전체
  if (lines.length > 1 && (words.length === 1 || ink(s) <= 5)) { markRange(l, words[0][0], words[words.length - 1][1]); return; }
  if (words.length === 1) return;
  // 다. 뒤에서부터 낱말을 모아 그 줄 글자 수의 35% 이상, 앞에는 한 낱말 이상 남긴다
  const total = ink(s);
  let k = words.length - 1, n = 0;
  while (k > 0) { n += words[k][1] - words[k][0]; if (n >= total * 0.35) break; k--; }
  k = Math.max(k, 1);
  markRange(l, words[k][0], words[words.length - 1][1]);
}

function lum(hex){
  const n = parseInt(String(hex).slice(1, 7), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}
// 미리보기 바탕 — 흰 글씨·흰 박스가 밝은 체크무늬에 묻히지 않게
function needsDark(st){
  if (st.bg) return false;
  // 박스가 있으면 어둡게 하지 않는다 — 흰 박스는 화면 미리보기에서 옅은 회색 테로 보이게 했다.
  // (전에는 밝은 박스면 어둡게 했는데, 노랑 박스(#FFE14D)도 밝다고 걸려 검정 바탕이 됐다 — 10/21 사용자님)
  if (st.box && st.box.shape !== 'none') return false;
  const fill = st.grad ? st.grad[0] : st.color;
  if (lum(fill) < 0.65) return false;
  // 안쪽·바깥 테 가운데 하나라도 진하면 밝은 바탕에서도 보인다(두 겹 노랑: 검정 안테 + 흰 바깥테)
  const edges = [st.outlineW ? st.outline : null, st.outerW ? st.outer : null].filter(Boolean);
  return !edges.some(e => lum(e) < 0.5);
}

/* ── 그리기 ──
   넉넉한 캔버스에 그린 뒤 잉크가 있는 곳만 잘라 낸다. 굵기·그림자 값은 글자 100px 기준이다.
   순서: 박스 → 형광펜 → 바깥 테두리(그림자) → 안쪽 테두리 → 글자. 그림자는 가장 바깥 층에만 준다. */
// preview: 화면 미리보기용 — 흰 박스에 옅은 회색 테를 그려 흰 바탕에서도 모양이 보이게(저장 그림에는 안 들어간다)
function render(st, scale, preview){
  const size = 110 * scale, u = size / 100;
  const ow = st.outlineW ? st.outlineW * u : 0;
  const xw = st.outerW ? st.outerW * u : 0;
  const font = size + "px '" + fam(st.font, st.w) + "', 'Noto Sans KR', sans-serif";
  const m = document.createElement('canvas').getContext('2d');
  m.font = font;
  const auto = !!(st.hl || st.marker);
  const ls = (st.ls || 0) * size / 100;                 // 자간 — 글자 크기의 %
  const lines = layoutText(st.text, auto, st.wrap).map(runs => {
    // 자간이 있으면 글자마다 놓는다(조각째로 그리면 글자 사이를 벌릴 수 없다)
    if (ls) {
      const chars = [];
      runs.forEach(r => Array.from(r.t).forEach(ch => chars.push({ t: ch, hl: r.hl, w: m.measureText(ch).width })));
      const W = chars.reduce((a, q) => a + q.w, 0) + ls * Math.max(0, chars.length - 1);
      return { runs: chars, W: Math.max(1, W), perChar: true };
    }
    runs.forEach(r => { r.w = m.measureText(r.t).width; });
    return { runs, W: Math.max(1, runs.reduce((a, r) => a + r.w, 0)) };
  });
  const maxW = Math.max.apply(null, lines.map(l => l.W));
  const box = st.box && st.box.shape !== 'none' ? st.box : null;
  const lineH = size * (box && box.shape !== 'circle' ? 1.42 : 1.25) * ((st.lh || 100) / 100);   // 줄 간격 — 기본의 %
  const curved = st.curve && st.curve !== 'none';
  const amt = (st.amt || 45) / 100;
  const pad = Math.max(ow, xw) + size * 0.9 + (curved ? maxW * 0.5 * amt : 0) + (box ? size * 1.2 : 0);
  const c = document.createElement('canvas');
  c.width = Math.ceil(maxW + pad * 2);
  c.height = Math.ceil(lines.length * lineH + pad * 2);
  const x = c.getContext('2d');
  x.font = font; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.lineJoin = 'round'; x.miterLimit = 2;
  const cx = c.width / 2;
  // 정렬 — 휜 글은 늘 가운데
  const align = curved ? 'center' : (st.align || 'center');
  const lineX = l => align === 'left' ? cx - maxW / 2 : align === 'right' ? cx + maxW / 2 - l.W : cx - l.W / 2;

  // 글자를 놓을 자리 — 곧은 글은 조각째로(자간이 있으면 글자마다), 휜 글은 글자마다
  const places = [];
  lines.forEach((l, i) => {
    const y = pad + size * 0.95 + i * lineH;
    l.y = y;
    if (!curved) {
      let s = lineX(l);
      l.x0 = s;
      l.runs.forEach(r => { places.push({ t: r.t, x: s + r.w / 2, y, r: 0, hl: r.hl, w: r.w, line: i }); s += r.w + (l.perChar ? ls : 0); });
      return;
    }
    const chars = l.perChar ? l.runs.map(q => ({ ch: q.t, hl: q.hl, w: q.w })) : [];
    if (!l.perChar) l.runs.forEach(r => Array.from(r.t).forEach(ch => chars.push({ ch, hl: r.hl, w: m.measureText(ch).width })));
    const sum = (chars.reduce((a, q) => a + q.w, 0) + ls * Math.max(0, chars.length - 1)) || 1, f = l.W / sum;
    let s = -l.W / 2;
    chars.forEach(q => {
      const w = q.w * f, mid = s + w / 2; s += w + ls * f;
      if (st.curve === 'wave') {
        const A = size * 0.16 * amt * 1.6, P = size * 4, ph = 2 * Math.PI * mid / P;
        places.push({ t: q.ch, x: cx + mid, y: y + A * Math.sin(ph), r: Math.atan(A * 2 * Math.PI / P * Math.cos(ph)) * 0.45, hl: q.hl, line: i });
      } else {
        const theta = Math.max(0.15, 2.4 * amt) * (l.W / Math.max(maxW, 1));
        const R = l.W / theta, a = mid / R, dir = st.curve === 'arch' ? 1 : -1;
        places.push({ t: q.ch, x: cx + R * Math.sin(a), y: y + dir * R * (1 - Math.cos(a)), r: dir * a, hl: q.hl, line: i });
      }
    });
  });
  function each(fn, only, ctx){
    ctx = ctx || x;
    places.forEach(p => {
      if (only === 'hl' && !p.hl) return;
      if (only === 'plain' && p.hl) return;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); fn(p.t, ctx); ctx.restore();
    });
  }
  function rrect(ctx, X, Y, W, H, R, noEdge){
    R = Math.min(R, H / 2, W / 2);
    ctx.beginPath(); ctx.moveTo(X + R, Y); ctx.arcTo(X + W, Y, X + W, Y + H, R); ctx.arcTo(X + W, Y + H, X, Y + H, R);
    ctx.arcTo(X, Y + H, X, Y, R); ctx.arcTo(X, Y, X + W, Y, R); ctx.closePath(); ctx.fill(); if (!noEdge) edge(ctx);
  }
  const lightBox = preview && st.box && lum(st.box.color) > 0.9;
  function edge(ctx){ if (!lightBox) return; ctx.save(); ctx.globalAlpha = 1; ctx.strokeStyle = '#D9D9D4'; ctx.lineWidth = Math.max(1.5, size * 0.02); ctx.stroke(); ctx.restore(); }

  // 1. 글자 뒤 박스 (휜 글에는 넣지 않는다)
  if (box && !curved) {
    x.save();
    x.globalAlpha = box.alpha == null ? 1 : box.alpha;
    x.fillStyle = box.color;
    if (box.shape === 'circle') {
      const top = lines[0].y - size * 0.86, bot = lines[lines.length - 1].y + size * 0.14;
      const rx = maxW / 2 + size * 0.5, ry = (bot - top) / 2 + size * 0.5, cy = (top + bot) / 2;
      /* 거의 네모난 글 덩어리만 동그라미 — 넓은 덩어리를 원에 넣으면 글자가 작아 보인다 */ if (rx / ry < 1.2) { x.beginPath(); x.arc(cx, cy, Math.max(rx, ry) * 1.04, 0, Math.PI * 2); x.fill(); edge(x); }
      else rrect(x, cx - rx, cy - ry, rx * 2, ry * 2, ry);               // 길면 둥근 알약으로
    } else {
      const R = box.shape === 'pill' ? size : size * 0.16;
      lines.forEach(l => {
        const px = size * (box.shape === 'pill' ? 0.42 : 0.28);
        rrect(x, l.x0 - px, l.y - size * 0.98, l.W + px * 2, size * 1.26, R);
      });
    }
    x.restore();
  }
  // 2. 형광펜 — 기본은 강조 낱말의 글자 키 전체를 덮는 띠(테두리가 있으면 그 바깥까지),
  //    '밑줄 형광펜'(markerHalf)은 아래쪽 절반만. 10/21 사용자님 "기본은 글자 전체 뒤에, 아래만은 단추로"
  if (st.marker && !curved) {
    const edgeW = Math.max(ow, xw) / 2;
    x.save(); x.fillStyle = st.marker;
    // 자간 때문에 글자마다 놓였어도, 같은 줄에서 이어진 강조 글자는 한 띠로 묶는다
    const spans = [];
    places.forEach(p => {
      if (!p.hl) return;
      const a = p.x - p.w / 2, b = p.x + p.w / 2, last = spans[spans.length - 1];
      if (last && last.line === p.line && a - last.b <= Math.abs(ls) + size * 0.02) last.b = b;
      else spans.push({ line: p.line, a, b, y: p.y });
    });
    spans.forEach(sp => {
      const w = sp.b - sp.a;
      if (st.markerHalf) {
        x.globalAlpha = 0.9;
        x.fillRect(sp.a - size * 0.05, sp.y - size * 0.36, w + size * 0.1, size * 0.42);
        return;
      }
      const px = edgeW + size * 0.1, top = sp.y - size * 0.98 - edgeW, h = size * 1.24 + edgeW * 2;
      rrect(x, sp.a - px, top, w + px * 2, h, size * 0.08, true);
    });
    x.restore();
  }
  // 3·4. 테두리
  const shadowOn = () => applyShadow(x, st.shadow, glowColorOf(st), u);
  const off = () => { x.shadowColor = 'transparent'; x.shadowBlur = 0; x.shadowOffsetX = 0; x.shadowOffsetY = 0; };
  if (st.shadow === 'glow') {
    // 빛을 한 겹 더 — 한 번만 번지게 하면 얇은 글씨에서 거의 안 보인다(테두리·글자보다 먼저 그려 그 뒤에 깔린다)
    shadowOn(); x.fillStyle = glowColorOf(st); each(t => x.fillText(t, 0, 0)); off();
  }
  if (xw) { shadowOn(); x.strokeStyle = st.outer; x.lineWidth = xw; each(t => x.strokeText(t, 0, 0)); off(); }
  if (ow) { if (!xw) shadowOn(); x.strokeStyle = st.outline; x.lineWidth = ow; each(t => x.strokeText(t, 0, 0)); off(); }
  if (!xw && !ow) shadowOn();
  // 5. 글자 — 그라데이션은 단색으로 찍고 캔버스 좌표 그대로의 그라데이션을 source-in 으로 덮는다
  //    (글자마다 옮기고 돌린 좌표계에서 칠하면 글자마다 첫 색만 묻었다)
  if (st.grad) {
    const l2 = document.createElement('canvas'); l2.width = c.width; l2.height = c.height;
    const lx = l2.getContext('2d');
    lx.font = font; lx.textAlign = 'center'; lx.textBaseline = 'alphabetic'; lx.fillStyle = '#000';
    each((t, ctx) => ctx.fillText(t, 0, 0), st.hl ? 'plain' : null, lx);
    const top = pad + size * 0.1, bot = pad + size * 1.0 + (lines.length - 1) * lineH;
    const g = st.grad.length >= 4 ? lx.createLinearGradient(cx - maxW / 2, 0, cx + maxW / 2, 0) : lx.createLinearGradient(0, top, 0, bot);
    st.grad.forEach((cl, n) => g.addColorStop(n / (st.grad.length - 1), cl));
    lx.globalCompositeOperation = 'source-in';
    lx.fillStyle = g; lx.fillRect(0, 0, l2.width, l2.height);
    x.drawImage(l2, 0, 0);
  } else {
    x.fillStyle = st.color; each(t => x.fillText(t, 0, 0), st.hl ? 'plain' : null);
  }
  if (st.hl) { x.fillStyle = st.hl; each(t => x.fillText(t, 0, 0), 'hl'); }
  off();
  return crop(c, Math.round(14 * scale), st.bg);
}

// 저장·복사 그림 — 긴 쪽이 1280px 이 되게 알아서 맞춘다(썸네일 1280×720 위에 올리기 알맞고, 붙인 뒤 줄여도 깨지지 않는다).
// 먼저 작게 그려 비율을 재고, 그 비율로 다시 크게 그린 뒤 마지막 몇 px 만 정확히 맞춘다.
const SAVE_LONG = 1280;
function renderForSave(st){
  const probe = render(st, 0.5);
  const k = SAVE_LONG / Math.max(probe.width, probe.height) * 0.5;
  const c = render(st, k);
  const long = Math.max(c.width, c.height);
  if (long === SAVE_LONG) return c;
  const f = SAVE_LONG / long, o = document.createElement('canvas');
  o.width = Math.round(c.width * f); o.height = Math.round(c.height * f);
  const ox = o.getContext('2d'); ox.imageSmoothingQuality = 'high';
  ox.drawImage(c, 0, 0, o.width, o.height);
  return o;
}

function crop(c, margin, bg){
  const x = c.getContext('2d'), W = c.width, H = c.height;
  const d = x.getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) {
    const row = y * W * 4;
    for (let i = 0; i < W; i++) {
      if (d[row + i * 4 + 3] > 8) {
        if (i < x0) x0 = i; if (i > x1) x1 = i;
        if (y < y0) y0 = y; y1 = y;
      }
    }
  }
  if (x1 < 0) { x0 = 0; y0 = 0; x1 = 1; y1 = 1; }
  const o = document.createElement('canvas');
  o.width = x1 - x0 + 1 + margin * 2; o.height = y1 - y0 + 1 + margin * 2;
  const ox = o.getContext('2d');
  if (bg) { ox.fillStyle = bg; ox.fillRect(0, 0, o.width, o.height); }
  ox.drawImage(c, x0, y0, x1 - x0 + 1, y1 - y0 + 1, margin, margin, x1 - x0 + 1, y1 - y0 + 1);
  return o;
}

/* ── 상태 ── */
const $ = id => document.getElementById(id);
const S = { use: 0, rec: 0, text: '', over: {}, scale: 2 };
const BASE = { color: '#111111', grad: null, outline: null, outlineW: 0, outer: null, outerW: 0, shadow: 'none', glow: null, markerHalf: false,
               align: 'center', ls: 0, lh: 100,
               hl: null, marker: null, box: null, curve: 'none', amt: 45, bg: '' };

function recipeState(r){ return Object.assign({}, BASE, r.style, { font: LOCK || r.font, w: LOCK ? 0 : (r.w || 0), wrap: USES[S.use].wrap, text: S.text }); }
function current(){ return Object.assign(recipeState(USES[S.use].recipes[S.rec]), S.over, { text: S.text }); }

let tick = 0;
async function draw(){
  const my = ++tick;
  const u = USES[S.use];
  const st = current();
  await Promise.all(u.recipes.map(r => { const q = recipeState(r); return ensure(q.font, q.w); }).concat([ensure(st.font, st.w)]));
  if (my !== tick) return;
  const stage = $('stage');
  stage.classList.toggle('dark', needsDark(st));
  stage.replaceChildren(render(st, 1, true));
  const cardsKey = S.use + '|' + S.text;
  if (cardsKey !== S.cardsKey || !$('recs').querySelector('.pv canvas')) {
    S.cardsKey = cardsKey;
    u.recipes.forEach((r, i) => {
      const b = $('recs').children[i], rs = recipeState(r), pv = b.querySelector('.pv');
      pv.replaceChildren(render(rs, 0.5, true));
    });
  }
  const f = byId.get(st.font);
  // 안내 두 줄 — 붙여넣기가 먼저, 라이선스 확인이 다음(10/21 사용자님)
  $('lic').innerHTML = '<span class="ln">캔바·미리캔버스·PPT에는 <b>복사 → 붙여넣기</b>로 바로 들어가요.</span>' +
    '<span class="ln">글꼴 <a href="' + ORIGIN + '/font/' + st.font + '" target="_blank" rel="noopener">' + esc(f ? f[1] : '') +
    '</a> · 쓰기 전에 상세페이지에서 라이선스를 한 번 확인해 주세요.</span>';
  $('hint').hidden = !(st.hl || st.marker);
  syncControls(st);
}
let timer = 0;
function drawSoon(){ clearTimeout(timer); timer = setTimeout(draw, 90); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ── 화면 짜기 ── */
function buildUses(){
  $('uses').replaceChildren.apply($('uses'), USES.map((u, i) => {
    const b = document.createElement('button');
    b.className = 'use'; b.textContent = u.title; b.setAttribute('aria-pressed', i === S.use);
    b.onclick = () => pickUse(i);
    return b;
  }));
}
function pickUse(i){
  S.use = i; S.rec = 0; S.over = {}; S.cardsKey = '';
  [...$('uses').children].forEach((b, j) => b.setAttribute('aria-pressed', j === i));
  const u = USES[i];
  if (!S.touched) { S.text = u.phrases[0]; $('txt').value = S.text; fit(); }
  $('recs').replaceChildren.apply($('recs'), u.recipes.map((r, j) => {
    const b = document.createElement('button');
    b.className = 'rec'; b.setAttribute('aria-pressed', j === 0);
    b.innerHTML = '<div class="pv"></div><div class="cap"><b>' + esc(r.name) + '</b><span>' + (LOCK ? '' : esc(byId.get(r.font)[1])) + '</span></div>';
    if (r.why) b.title = r.why;
    b.onclick = () => { S.rec = j; S.over = {}; [...$('recs').children].forEach((c, n) => c.setAttribute('aria-pressed', n === j)); draw(); };
    return b;
  }));
  // 폰트 더보기 — 이 쓸 곳에 폰트픽이 추천한 폰트 전부(허브 위쪽·꾸밈에 쓴 폰트 → 나머지), 처음엔 접혀 있다
  const all = u.fonts.concat(u.more);
  $('fmoreBtn').textContent = '폰트 더보기 (' + all.length + ')';
  $('fmoreBtn').setAttribute('aria-expanded', 'false');
  $('fmore').hidden = true;
  $('fmore').replaceChildren.apply($('fmore'), all.map(id => {
    const b = document.createElement('button'); b.dataset.f = id; b.textContent = byId.get(id)[1];
    b.onclick = () => setOver({ font: id, w: 0 });
    return b;
  }));
  draw();
}
function setOver(o){ Object.assign(S.over, o); draw(); }

function swatches(el, list, onpick){
  const kids = list.map(cl => {
    const b = document.createElement('button'); b.style.background = cl; b.dataset.v = cl; b.setAttribute('aria-label', cl);
    b.onclick = () => onpick(cl);
    return b;
  });
  // 팔레트 — 색 직접 고르기
  const pal = document.createElement('label');
  pal.className = 'pal'; pal.title = '색 직접 고르기';
  const inp = document.createElement('input'); inp.type = 'color'; inp.setAttribute('aria-label', '색 직접 고르기');
  let rq = 0;
  inp.addEventListener('input', () => { cancelAnimationFrame(rq); rq = requestAnimationFrame(() => onpick(inp.value.toUpperCase())); });
  pal.appendChild(inp);
  // 스포이트는 따로 두지 않는다 — 팔레트(브라우저 색상표) 안에 이미 있다(10/21 사용자님)
  el.replaceChildren.apply(el, kids.concat([pal]));
}
function press(el, attr, val){
  let hit = false;
  [...el.children].forEach(b => {
    if (b.classList.contains('pal') || b.classList.contains('eye')) return;
    const on = String(b.dataset[attr]).toUpperCase() === String(val).toUpperCase();
    if (on) hit = true;
    b.setAttribute('aria-pressed', on);
  });
  // 색 줄: 견본에 없는 색이면 팔레트가 눌린 상태로, 가운데에 그 색
  const pal = el.querySelector(':scope > .pal');
  if (pal) {
    const custom = !hit && /^#[0-9a-f]{6}$/i.test(String(val));
    pal.setAttribute('aria-pressed', custom);
    if (custom) { pal.style.setProperty('--cur', val); pal.querySelector('input').value = String(val).toLowerCase(); }
  }
}
function syncControls(st){
  press($('align'), 'a', st.align || 'center');
  $('ls').value = st.ls || 0; $('lsv').textContent = st.ls || 0;
  $('lh').value = st.lh || 100; $('lhv').textContent = (st.lh || 100) + '%';
  press($('col'), 'v', st.grad ? '' : st.color);
  const mode = st.marker ? (st.markerHalf ? 'half' : 'marker') : st.hl ? 'text' : 'none';
  press($('hlmode'), 'm', mode);
  press($('hcol'), 'v', st.marker || st.hl || '');
  const w = st.outerW ? 'two' : !st.outlineW ? 0 : st.outlineW <= 7 ? 6 : st.outlineW <= 12 ? 10 : 16;
  press($('ow'), 'w', w);
  press($('ocol'), 'v', st.outlineW ? st.outline : '');
  press($('sh'), 'v', st.shadow);
  $('gcol').hidden = st.shadow !== 'glow';
  press($('gcol'), 'v', st.shadow === 'glow' ? glowColorOf(st) : '');
  press($('box'), 'b', st.box ? st.box.shape : 'none');
  press($('bcol'), 'v', st.box ? st.box.color : '');
  press($('curve'), 'c', st.curve);
  $('amt').hidden = st.curve === 'none'; $('amt').value = st.amt;
  press($('fmore'), 'f', st.font);
  press($('bg'), 'b', st.bg || '');
}

function fit(){ const t = $('txt'); t.style.height = 'auto'; t.style.height = (t.scrollHeight + 3) + 'px'; }
addEventListener('load', fit); addEventListener('resize', fit);

function wire(){
  $('txt').addEventListener('input', e => { S.text = e.target.value; S.touched = true; fit(); drawSoon(); });
  swatches($('col'), COLORS, cl => setOver({ color: cl, grad: null }));
  swatches($('hcol'), HCOLORS, cl => { const st = current(); setOver(st.marker ? { marker: cl } : { hl: cl, marker: null }); });
  $('hlmode').onclick = e => {
    const m = e.target.dataset.m; if (!m) return;
    const st = current(), cl = st.marker || st.hl || '#FFE400';
    if (m === 'none') setOver({ hl: null, marker: null });
    if (m === 'text') setOver({ hl: cl === '#FFF27A' ? '#FFE400' : cl, marker: null });
    if (m === 'marker' || m === 'half') setOver({ marker: cl === '#FFE400' ? '#FFF27A' : cl, hl: null, markerHalf: m === 'half' });
  };
  $('ow').onclick = e => {
    const w = e.target.dataset.w; if (w === undefined) return;
    const st = current();
    /* 두 겹 — 고른 테두리 색은 안쪽에 그대로 두고, 바깥에 대비되는 색(어두우면 흰색, 밝으면 검정)을 하나 더 두른다.
       10/21 사용자님 "두 겹을 한 번 선택하면 컬러가 흰색으로 지정되고, 다른 테두리를 선택해도 계속 두 겹으로 나와" —
       전에는 안쪽 색을 흰색으로 바꿔 버려서, 한 겹으로 돌아가도 흰 테가 남아 그림자와 겹쳐 두 겹처럼 보였다. */
    const inner = st.outlineW ? st.outline : '#111111';
    if (w === 'two') setOver({ outline: inner, outlineW: Math.max(st.outlineW || 0, 10), outer: lum(inner) > 0.5 ? '#111111' : '#FFFFFF', outerW: 26 });
    else setOver({ outlineW: +w, outline: inner, outer: null, outerW: 0 });
  };
  swatches($('ocol'), OCOLORS, cl => { const st = current(); setOver({ outline: cl, outlineW: st.outlineW || 10 }); });
  $('sh').onclick = e => { const v = e.target.dataset.v; if (v) setOver({ shadow: v }); };
  swatches($('gcol'), GCOLORS, cl => setOver({ shadow: 'glow', glow: cl }));
  $('box').onclick = e => {
    const b = e.target.dataset.b; if (!b) return;
    const st = current();
    setOver({ box: b === 'none' ? null : Object.assign({ color: '#FFE14D', alpha: 1 }, st.box, { shape: b }) });
  };
  swatches($('bcol'), BCOLORS, cl => { const st = current(); setOver({ box: Object.assign({ shape: 'line', alpha: 1 }, st.box, { color: cl }) }); });
  $('curve').onclick = e => { const c = e.target.dataset.c; if (c) setOver({ curve: c }); };
  $('amt').oninput = e => { S.over.amt = +e.target.value; drawSoon(); };
  $('align').onclick = e => { const a = e.target.dataset.a; if (a) setOver({ align: a }); };
  $('ls').oninput = e => { S.over.ls = +e.target.value; $('lsv').textContent = e.target.value; drawSoon(); };
  $('lh').oninput = e => { S.over.lh = +e.target.value; $('lhv').textContent = e.target.value + '%'; drawSoon(); };
  $('bg').onclick = e => { const b = e.target.dataset.b; if (b !== undefined) setOver({ bg: b }); };
  $('reset').onclick = () => { S.over = {}; draw(); };
  $('fmoreBtn').onclick = () => {
    const open = $('fmore').hidden;
    $('fmore').hidden = !open;
    $('fmoreBtn').setAttribute('aria-expanded', String(open));
    if (open) [...$('fmore').children].forEach(b => {
      if (b.style.fontFamily) return;
      if (io) io.observe(b);
      else ensurePreview(+b.dataset.f).then(k => { if (k) b.style.fontFamily = "'" + k + "', var(--ui)"; });
    });
  };
  $('save').onclick = async () => {
    const st = current(); await ensure(st.font, st.w);
    const c = renderForSave(st);
    c.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = '폰트픽_' + (S.text.replace(/[\[\]\\/:*?"<>|\n]/g, ' ').trim().slice(0, 12) || '글자') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('저장했어요');
    }, 'image/png');
  };
  $('copy').onclick = async () => {
    const st = current(); await ensure(st.font, st.w);
    const c = renderForSave(st);
    try {
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      toast('복사했어요 — 캔바·PPT에서 붙여넣기(Ctrl+V) 하세요');
    } catch (err) {
      toast('이 브라우저는 이미지 복사를 막아 두었어요. PNG 저장을 눌러 주세요.');
    }
  };
}
let tt = 0;
function toast(m){ $('toast').textContent = m; clearTimeout(tt); tt = setTimeout(() => { $('toast').textContent = ''; }, 3500); }

wire();
buildUses();
// 주소 끝 #0~#4 로 쓸 곳을 골라 열 수 있다(예: /text-design#3 → 스티커·굿즈). PC 에서는 더 꾸미기를 펼쳐 둔다
const h = location.hash.slice(1).split('-');
if (matchMedia('(min-width:861px)').matches) $('more').open = true;
pickUse(Math.min(USES.length - 1, parseInt(h[0], 10) || 0));
})();
</script>
