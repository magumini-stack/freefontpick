  <style>
    :root{
      --bg:#FFFFFF;--bg-card:#fff;--bg-secondary:#F5F5F3;
      --text-primary:#1A1A1A;--text-secondary:#6B6B6B;--text-muted:#9A9A9A;
      --border:rgba(0,0,0,.09);--border-hover:rgba(0,0,0,.18);
      --accent:#1E3A8A;--accent-light:#EEF2FB;--accent-hover:#16307A;
      --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
      --shadow-card:0 1px 4px rgba(0,0,0,.06);--shadow-hover:0 6px 20px rgba(0,0,0,.1);
      --status-allow-bg:#E8F7EE;--status-allow-fg:#1A8A3A;
      --status-deny-bg:#FDECEC;--status-deny-fg:#C8281F;
      --status-reviewed-bg:#FFF4E0;--status-reviewed-fg:#B8790A;
      --status-added-bg:#E8F7EE;--status-added-fg:#1A8A3A;
      --ofl-grad-a:#F4F7FD;--ofl-border:#CBD8F2;
      color-scheme:light;
    }
    :root[data-theme="dark"]{
      --bg:#141414;--bg-card:#1E1E1E;--bg-secondary:#2A2A2A;
      --text-primary:#F0F0EC;--text-secondary:#A0A09A;--text-muted:#666660;
      --border:rgba(255,255,255,.1);--border-hover:rgba(255,255,255,.2);
      --accent:#5B82E0;--accent-light:#141A2A;--accent-hover:#7B9CE8;
      --shadow-card:0 1px 4px rgba(0,0,0,.3);--shadow-hover:0 6px 24px rgba(0,0,0,.4);
      --status-allow-bg:#0F2A18;--status-allow-fg:#5FCB85;
      --status-deny-bg:#2A0F0E;--status-deny-fg:#FF7873;
      --status-reviewed-bg:#2E2410;--status-reviewed-fg:#E0AC4D;
      --status-added-bg:#0F2A18;--status-added-fg:#5FCB85;
      --ofl-grad-a:#151B2B;--ofl-border:#243357;
      color-scheme:dark;
    }
    @media(prefers-color-scheme:dark){
      :root:not([data-theme="light"]):not([data-theme="dark"]){
        --bg:#141414;--bg-card:#1E1E1E;--bg-secondary:#2A2A2A;
        --text-primary:#F0F0EC;--text-secondary:#A0A09A;--text-muted:#666660;
        --border:rgba(255,255,255,.1);--border-hover:rgba(255,255,255,.2);
        --accent:#5B82E0;--accent-light:#141A2A;--accent-hover:#7B9CE8;
        --shadow-card:0 1px 4px rgba(0,0,0,.3);--shadow-hover:0 6px 24px rgba(0,0,0,.4);
        --status-allow-bg:#0F2A18;--status-allow-fg:#5FCB85;
        --status-deny-bg:#2A0F0E;--status-deny-fg:#FF7873;
        --status-reviewed-bg:#2E2410;--status-reviewed-fg:#E0AC4D;
        --status-added-bg:#0F2A18;--status-added-fg:#5FCB85;
        --ofl-grad-a:#151B2B;--ofl-border:#243357;
        color-scheme:dark;
      }
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;line-height:1.6}

    /* ════════ 홈 (2026-09-22 메인 개편) ════════
       구성: 히어로(키커·h1 + 기능 입구 4칸) → 쓰는 자리 점프 바 → 광고 띠 →
       용도별 추천 4종 섹션 × N → "원하는 폰트가 없나요?" → 공지(해시 #notice).
       본문 섹션은 서버가 그린다(app/routers/design.py render_home_sections).
       카드 이름(.font-card 등)은 /fonts 격자 보기와 같다 — 한쪽을 고치면 다른 쪽도
       같이 볼 것. 시안: 2026-09-22 채팅의 시안 K. */
    .wrap{max-width:1400px;margin:0 auto;padding:0 32px}

    /* 히어로 — 왼쪽 제목, 오른쪽 기능 입구 2×2 */
    .hero{padding:24px 0 18px;display:grid;grid-template-columns:1fr 640px;gap:32px;align-items:center}
    .hero-kicker{font-size:15px;color:var(--accent);font-weight:700;margin-bottom:10px}
    /* 제목은 두 줄 고정(<br>). 화면이 좁아지면 br 을 무시하고 자연 줄바꿈. */
    .hero-title{font-size:clamp(24px,2.7vw,38px);font-weight:800;line-height:1.3;letter-spacing:-1px;margin:0;
      word-break:keep-all}
    .hero-title em{font-style:normal;box-shadow:inset 0 -.3em 0 var(--accent-light)}
    .tools{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px}
    .tool{display:flex;gap:12px;align-items:center;padding:11px 16px;min-height:64px;background:var(--bg-card);
      border:1px solid var(--border);border-radius:12px;text-decoration:none;color:inherit;transition:border-color .15s}
    .tool:hover{border-color:var(--accent)}
    .tool > span:last-of-type{min-width:0;flex:1}
    .tool-ico{flex:0 0 38px;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
      background:var(--accent-light);color:var(--accent)}
    .tool-ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .tool.gif .tool-ico{background:linear-gradient(100deg,#FF4D6D,#FF9F1C,#2EC4B6,#4361EE,#B5179E,#FF4D6D);
      background-size:300% 100%;color:#fff;animation:ffpGifFlow 6s linear infinite}
    .tool.find .tool-ico{background:#FFF4E0;color:#B8790A}
    .tool.apps .tool-ico{background:var(--text-primary);color:var(--bg-card)}
    :root[data-theme="dark"] .tool.find .tool-ico{background:#2A2210}
    @media(prefers-reduced-motion:reduce){.tool.gif .tool-ico{animation:none}}
    .tool-t{font-size:15px;font-weight:800;letter-spacing:-.3px;margin-bottom:2px;display:flex;align-items:center;gap:6px}
    /* 설명은 한 줄 고정 — 글자 수가 달라도 네 칸 높이가 같아야 한다 */
    .tool-d{font-size:12.5px;color:var(--text-secondary);line-height:1.4;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tool-new{font-size:10px;font-weight:800;color:#fff;background:#FF4D6D;border-radius:4px;padding:1px 5px;letter-spacing:.3px}

    /* 쓰는 자리 점프 바 — 헤더 아래 붙어 따라다닌다 */
    .use-bar{position:sticky;top:60px;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:10px;padding:10px 0}
    .use-bar-label{font-size:12px;color:var(--text-muted);font-weight:700;white-space:nowrap}
    .use-bar-scroll{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;-ms-overflow-style:none}
    .use-bar-scroll::-webkit-scrollbar{display:none}
    .use-chip{font-size:12.5px;padding:5px 11px;border-radius:14px;border:1px solid var(--border);background:var(--bg-card);
      color:var(--text-secondary);white-space:nowrap;text-decoration:none;transition:all .15s}
    .use-chip:hover{background:var(--text-primary);color:var(--bg-card);border-color:var(--text-primary)}

    /* 광고 띠 — 쓰는 자리 바 바로 아래. 높이는 반응형 가로 광고(구글이 정함).
       안 채워지면 header.css 가 칸째 접는다. */
    .home-ad{margin:18px 0 0;background:var(--bg-secondary);border-radius:10px;padding:10px 12px 12px;min-height:110px}

    /* 용도별 섹션 */
    .use-sec{padding:26px 0 18px;border-bottom:1px solid var(--border);scroll-margin-top:110px}
    .use-sec:last-of-type{border-bottom:none}
    .use-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
    .use-head h2{font-size:21px;font-weight:800;letter-spacing:-.5px;margin:0 0 3px;line-height:1.3}
    .use-head p{margin:0;font-size:13px;color:var(--text-secondary)}
    .use-head .more{font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap;
      background:var(--accent-light);padding:7px 12px;border-radius:8px}
    .use-head .more:hover{background:var(--accent);color:#fff}

    /* 카드 — /fonts 격자 보기와 같은 상자 카드 */
    .font-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .font-card{cursor:pointer;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
      padding:22px 34px 26px 22px;min-height:240px;position:relative;display:flex;flex-direction:column;min-width:0;
      text-decoration:none;color:inherit;transition:border-color .15s}
    .font-card:hover{border-color:var(--accent)}
    .font-meta{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-width:0;margin-bottom:26px}
    .font-line1{display:flex;align-items:center;gap:6px;min-width:0;margin-bottom:3px}
    .font-line2{display:flex;align-items:center;gap:6px;row-gap:4px;min-width:0;flex-wrap:wrap}
    .font-name{font-size:13.5px;font-weight:700;color:var(--text-primary);letter-spacing:-.1px;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;min-width:0}
    .font-weights{font-size:11px;color:var(--text-secondary);white-space:nowrap;flex-shrink:0}
    .font-maker{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .font-tag{font-size:10px;line-height:1;color:var(--text-muted);border:1px solid var(--border);border-radius:3px;
      padding:3px 6px;white-space:nowrap;max-width:112px;overflow:hidden;text-overflow:ellipsis}
    .font-tag.rank{color:var(--accent);border-color:var(--accent);font-weight:700;flex:none;max-width:none}
    .font-preview{flex:1 1 auto;min-height:0;display:flex;align-items:center}
    .font-preview-text{font-size:30px;color:var(--text-primary);line-height:1.32;word-break:keep-all;overflow:hidden;
      display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
    .font-actions{position:absolute;right:10px;top:12px}
    .btn-download{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;color:var(--text-muted);border-radius:2px}
    .btn-download svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .font-card:hover .btn-download{color:var(--accent);background:var(--accent-light)}

    /* 하단 — 원하는 폰트가 없나요? */
    .all-cta{text-align:center;padding:48px 0 70px;border-top:1px solid var(--border)}
    .all-cta p{margin:0 0 14px;font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--text-secondary)}
    .all-btn{display:inline-block;background:var(--text-primary);color:var(--bg-card);font-size:15px;font-weight:800;
      padding:14px 26px;border-radius:10px;text-decoration:none;letter-spacing:-.2px;transition:background .15s}
    .all-btn:hover{background:var(--accent);color:#fff}

    /* 공지 화면 제목 */
    .notice-title{font-size:clamp(21px,3.1vw,32px);font-weight:800;letter-spacing:-.8px;margin:0 0 6px}
    .hero-eyebrow{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em;margin-bottom:10px}
    .main{max-width:1400px;margin:0 auto;padding:14px 32px 80px}

    @media(max-width:1080px){
      .hero{grid-template-columns:1fr;gap:18px;padding:22px 0 16px}
      .hero-title br{display:none}
      .font-grid{grid-template-columns:repeat(3,1fr)}
    }
    @media(max-width:768px){
      .wrap{padding:0 16px}
      .main{padding:14px 16px 60px}
      .tools{gap:8px}
      .tool{padding:12px;min-height:0;flex-direction:column;align-items:flex-start;gap:8px}
      .tool-d{white-space:normal}
      .use-head{flex-direction:column;align-items:flex-start;gap:8px}
      .font-grid{grid-template-columns:repeat(2,1fr);gap:10px}
      .font-card{padding:16px 30px 18px 16px;min-height:190px}
      .font-preview-text{font-size:24px}
    }
    @media(max-width:460px){.font-grid{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
    /* NOTICE VIEW */
    .notice-hero{max-width:1400px;margin:0 auto;padding:44px 32px 28px;text-align:center}
    .notice-hero-sub{font-size:14px;color:var(--text-secondary)}
    .notice-list{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-card)}
    .notice-row{display:flex;align-items:center;gap:14px;padding:18px 22px;border-top:1px solid var(--border);cursor:pointer;transition:background .15s;text-decoration:none;color:inherit}
    .notice-row:first-child{border-top:none}
    .notice-row:hover{background:var(--bg-secondary)}
    .notice-pin{width:24px;height:24px;border-radius:6px;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
    .notice-pin.empty{visibility:hidden}
    .notice-row-content{flex:1;min-width:0}
    .notice-row-title{font-size:14px;font-weight:700;color:var(--text-primary);letter-spacing:-.2px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
    .notice-row-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;background:var(--accent-light);color:var(--accent);letter-spacing:.3px;flex-shrink:0}
    .notice-row-date{font-size:12px;color:var(--text-muted)}
    .notice-row i.chevron{color:var(--text-muted);font-size:18px;flex-shrink:0}
    .notice-empty{padding:80px 20px;text-align:center;color:var(--text-muted)}
    .notice-empty i{font-size:40px;display:block;margin-bottom:10px}

    .notice-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text-secondary);background:transparent;border:none;cursor:pointer;padding:6px 0;margin-bottom:16px;font-family:inherit;transition:color .15s}
    .notice-back:hover{color:var(--accent)}
    .notice-detail{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px 32px 36px;box-shadow:var(--shadow-card)}
    .notice-detail-head{padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:24px}
    .notice-detail-head h2{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--text-primary);line-height:1.4;margin-bottom:10px}
    .notice-detail-meta{font-size:12px;color:var(--text-muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
    .notice-detail-meta .pin{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700}
    .notice-detail-body{font-size:14px;line-height:1.8;color:var(--text-primary);word-break:break-word}
    .notice-detail-body p{margin-bottom:1em}
    .notice-detail-body p:last-child{margin-bottom:0}
    .notice-detail-body strong,.notice-detail-body b{font-weight:800;color:var(--text-primary)}
    .notice-detail-body a{color:var(--accent);text-decoration:underline}

    @media(max-width:640px){
      .notice-hero{padding:28px 16px 20px}
      .notice-row{padding:16px 16px;gap:10px}
      .notice-detail{padding:24px 20px}
      .notice-detail-head h2{font-size:18px}
    }

    /* SCROLL TOP */
    /* 하단 앵커 광고가 떠 있으면 그 위로 올라간다(--ffp-anchor-h, app/header.py). */
    .scroll-top{position:fixed;bottom:calc(28px + var(--ffp-anchor-h, 0px));right:28px;width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 14px rgba(30,58,138,.4);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s,bottom .2s;z-index:300}
    .scroll-top.visible{opacity:1;transform:translateY(0)}
    .scroll-top:hover{background:var(--accent-hover)}

  </style>
</head>
<body>

<!-- HEADER -->
<!--FFP_HEADER-->

<!-- ━━━━ 홈 (2026-09-22 메인 개편) ━━━━
     옛 홈(폰트 갤러리 전체)은 static/fonts.html (/fonts) 로 옮겨 갔다.
     이 파일은 용도별 추천 4종을 서버가 그려서 내리는 홈이다. -->
<div id="homeView">
<div class="wrap">

  <!-- 히어로: 왼쪽 제목 · 오른쪽 기능 입구 4칸 -->
  <section class="hero">
    <div>
      <div class="hero-kicker">무료폰트 큐레이션 및 조합 찾기</div>
      <h1 class="hero-title">어디에 쓰실 건가요?<br><em>딱 맞는 무료폰트</em> 추천해드릴게요!</h1>
    </div>
    <nav class="tools" aria-label="폰트픽 기능">
      <a class="tool pair" href="/font-pair" target="_blank" rel="noopener">
        <span class="tool-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20h3"/><path d="M14 20h7"/><path d="M6.9 15h6.9"/><path d="M10.2 6.3l5.8 13.7"/><path d="M5 20l6-16h2l7 16"/></svg></span>
        <span><span class="tool-t">폰트 조합 찾기</span><span class="tool-d">타이틀 · 본문 폰트 짝 찾기</span></span>
      </a>
      <a class="tool find" href="/find-font">
        <span class="tool-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg></span>
        <span><span class="tool-t">비슷한 무료폰트 추천 <span class="tool-new">NEW</span></span><span class="tool-d">사진 속 글씨와 닮은 폰트 찾기</span></span>
      </a>
      <a class="tool gif" href="/gif" target="_blank" rel="noopener">
        <span class="tool-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg></span>
        <span><span class="tool-t">GIF 만들기</span><span class="tool-d">템플릿 50종 만들어 두었어요!</span></span>
      </a>
      <a class="tool apps" href="https://tdtd.io/apps.html" target="_blank" rel="noopener">
        <span class="tool-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M11 18h2"/></svg></span>
        <span><span class="tool-t">글자로 노는 앱</span><span class="tool-d">글씨사진관 · 움짤공방 다운받기</span></span>
      </a>
    </nav>
  </section>

  <!-- 쓰는 자리 점프 바 + 광고 띠 + 용도별 추천 섹션 (서버가 그린다) -->
  <main id="homeMain">
    {{FFP_HOME_SECTIONS}}
  </main>

  <section class="all-cta">
    <p>원하는 폰트가 없나요?</p>
    <a class="all-btn" href="/fonts">전체 폰트 보기 →</a>
  </section>

</div><!-- /wrap -->
</div><!-- /homeView -->

<!-- ━━━━ NOTICE VIEW (공지사항) ━━━━ -->
<div id="noticeView" style="display:none">
  <section class="notice-hero">
    <div class="hero-eyebrow"><i class="ti ti-speakerphone" aria-hidden="true"></i> NOTICE</div>
    <h2 class="notice-title">공지사항</h2>
    <p class="notice-hero-sub">FreeFontPick에서 알려드리는 최신 소식</p>
  </section>

  <main class="main">
    <!-- 목록 화면 -->
    <div id="noticeListPanel">
      <div class="notice-list" id="noticeList"></div>
    </div>

    <!-- 상세 화면 -->
    <div id="noticeDetailPanel" style="display:none">
      <button class="notice-back" onclick="goNoticeList()">
        <i class="ti ti-arrow-left" aria-hidden="true"></i> 목록으로
      </button>
      <article class="notice-detail">
        <div class="notice-detail-head">
          <h2 id="noticeDetailTitle"></h2>
          <div class="notice-detail-meta" id="noticeDetailMeta"></div>
        </div>
        <div class="notice-detail-body" id="noticeDetailBody"></div>
      </article>
    </div>
  </main>
</div><!-- /noticeView -->

<!--FFP_FOOTER-->

<button class="scroll-top" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="맨 위로">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
</button>

<!-- 카드 글꼴 자료 — 서버가 섹션과 함께 내린다(design.py home_fonts_json) -->
<script type="application/json" id="homeFonts">{{FFP_HOME_FONTS}}</script>
<script src="/static/api-client.js"></script>
<script src="/static/ffp-fontface.js"></script>
<script>
/* ── 카드에 글꼴 입히기 ──
   서버가 카드를 다 그려 두었으므로 여기서는 화면에 가까워진 카드의 폰트 파일만
   받아 font-family 를 얹는다. 미리보기 서브셋(.p)이라 가볍다. */
(function(){
  var fonts = {};
  try { JSON.parse(document.getElementById('homeFonts').textContent || '[]')
          .forEach(function(f){ fonts[f.id] = f; }); } catch(e){}
  function dress(card){
    var f = fonts[parseInt(card.dataset.fontId, 10)];
    var el = card.querySelector('.font-preview-text');
    if(!f || !el || !window.FFPFont) return;
    FFPFont.ensureFont(f, true);
    el.style.fontFamily = FFPFont.stackOf(f);
  }
  var cards = document.querySelectorAll('.font-card[data-font-id]');
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){ dress(en.target); io.unobserve(en.target); }
      });
    }, {rootMargin:'300px 0px'});
    cards.forEach(function(c){ io.observe(c); });
  } else {
    cards.forEach(dress);
  }

  /* 쓰는 자리 칩 — 섹션으로 부드럽게 이동. 해시를 주소에 남기지 않는다
     (남기면 route() 가 모르는 해시로 읽는다). */
  document.addEventListener('click', function(e){
    var a = e.target.closest('.use-chip');
    if(!a) return;
    var id = (a.getAttribute('href') || '').slice(1);
    var sec = id && document.getElementById(id);
    if(!sec) return;
    e.preventDefault();
    sec.scrollIntoView({behavior:'smooth', block:'start'});
  });

  /* 광고 띠 채우기 (app/header.py ffpLazyAds) */
  if(typeof window.ffpLazyAds === 'function') window.ffpLazyAds(document.getElementById('homeMain'), false);
})();

/* ── 모바일 햄버거 메뉴 (헤더는 서버가 주입) ── */
function closeMobileNav(){
  const n = document.getElementById('mnav');
  if(n){ n.hidden = true; n.classList.remove('open'); }
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    const m = document.getElementById('mnav');
    if(m && !m.hidden) closeMobileNav();
  }
});
window.addEventListener('scroll', function(){
  document.getElementById('scrollTopBtn').classList.toggle('visible', window.scrollY > 600);
});

/* ── 해시 라우팅 ──
   #notice, #notice/{id} 만 이 페이지가 처리한다. 옛 홈의 #search/·#tag/ 는
   갤러리가 옮겨 간 /fonts 로 보낸다 — 밖에 퍼진 링크가 깨지지 않게. */
function setMenuActive(on){
  ['noticeMenuLink','mNoticeMenuLink'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.classList.toggle('active', !!on);
  });
}
function showHomeView(){
  document.getElementById('homeView').style.display = '';
  document.getElementById('noticeView').style.display = 'none';
}
function showNoticeView(){
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('noticeView').style.display = '';
}
function showNoticePanel(which){
  document.getElementById('noticeListPanel').style.display = which==='list' ? '' : 'none';
  document.getElementById('noticeDetailPanel').style.display = which==='detail' ? '' : 'none';
}
function goNoticeList(){ location.hash = '#notice'; }
function goNoticeDetail(id){ location.hash = '#notice/' + id; }

async function route(){
  /* 애드센스 전면 광고(비네트)는 주소 끝에 #google_vignette 를 붙인다. 우리 화면
     주소가 아니므로 없는 것으로 친다. */
  const hash = location.hash === '#google_vignette' ? '' : location.hash;
  if(hash === '#notice'){
    showNoticeView(); setMenuActive(true);
    await renderNoticeList(); showNoticePanel('list');
    window.scrollTo({top:0});
  } else if(hash.startsWith('#notice/')){
    const id = parseInt(hash.split('/')[1], 10);
    showNoticeView(); setMenuActive(true);
    await renderNoticeDetail(id); showNoticePanel('detail');
    window.scrollTo({top:0});
  } else if(hash.startsWith('#search/') || hash.startsWith('#tag/')){
    location.replace('/fonts' + hash);
  } else if(hash === '#submit'){
    location.replace('/find-font');
  } else {
    showHomeView(); setMenuActive(false);
  }
}
/* 상세페이지의 [라이선스 보기] → 옛 주소 /?license=1. 요약표 모달은 /fonts 에 있다. */
if(new URLSearchParams(location.search).has('license')){
  location.replace('/fonts?license=1');
}
route();
const onNavigate = () => { if(location.hash !== '#google_vignette') route(); };
window.addEventListener('hashchange', onNavigate);
window.addEventListener('popstate', onNavigate);
/* 어드민에서 공지를 고치면 보고 있던 공지 화면을 갱신 */
if(typeof onDataChanged === 'function'){
  onDataChanged(async () => { if(location.hash.startsWith('#notice')) await route(); });
}

/* ════════════════════════════════════════════
   공지사항 렌더링
════════════════════════════════════════════ */
function formatNoticeDate(ts){
  if(ts == null || ts === '') return '';
  const d = new Date(ts);
  // 유효하지 않은 날짜면 원본 문자열이라도 반환하지 않고 빈 문자열
  if(isNaN(d.getTime())) return '';
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}.${mm}.${dd}`;
}
/* 공지사항 객체에서 등록일/수정일 추출 (snake_case, camelCase 모두 지원) */
function noticeCreatedAt(n){ return n.created_at || n.createdAt || null; }
function noticeUpdatedAt(n){ return n.updated_at || n.updatedAt || null; }

async function renderNoticeList(){
  const notices = await NoticeStore.getAll();
  const wrap = document.getElementById('noticeList');
  if(!notices.length){
    wrap.innerHTML = `<div class="notice-empty">
      <i class="ti ti-speakerphone" aria-hidden="true"></i>
      <p>등록된 공지사항이 없어요</p>
    </div>`;
    return;
  }
  // 핀 고정된 글이 위로 오도록 정렬
  notices.sort((a,b)=>{
    if(a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    // 날짜 문자열을 timestamp로 변환해서 비교 (snake_case, camelCase 둘 다 대응)
    const ta = new Date(noticeCreatedAt(a) || 0).getTime();
    const tb = new Date(noticeCreatedAt(b) || 0).getTime();
    return tb - ta;
  });
  wrap.innerHTML = notices.map(n => `
    <a class="notice-row" href="#notice/${n.id}" aria-label="${escapeHtml(n.title)}">
      <div class="notice-pin${n.pinned?'':' empty'}" aria-hidden="true"><i class="ti ti-pin-filled"></i></div>
      <div class="notice-row-content">
        <div class="notice-row-title">${n.pinned?'<span class="notice-row-badge">중요</span>':''}${escapeHtml(n.title)}</div>
        <div class="notice-row-date">${formatNoticeDate(noticeCreatedAt(n))}</div>
      </div>
      <i class="ti ti-chevron-right chevron" aria-hidden="true"></i>
    </a>
  `).join('');
}

async function renderNoticeDetail(id){
  const n = await NoticeStore.getById(id);
  const titleEl = document.getElementById('noticeDetailTitle');
  const metaEl = document.getElementById('noticeDetailMeta');
  const bodyEl = document.getElementById('noticeDetailBody');
  if(!n){
    titleEl.textContent = '존재하지 않는 공지사항이에요';
    metaEl.innerHTML = '';
    bodyEl.innerHTML = '<p style="color:var(--text-muted);font-size:13px">목록으로 돌아가서 다른 글을 확인해주세요.</p>';
    return;
  }
  titleEl.textContent = n.title;
  const updatedAt = noticeUpdatedAt(n);
  const createdAt = noticeCreatedAt(n);
  metaEl.innerHTML = (n.pinned?'<span class="pin"><i class="ti ti-pin-filled" style="font-size:13px"></i> 중요</span>':'') +
    `<span>등록일 ${formatNoticeDate(createdAt)}</span>` +
    (updatedAt && updatedAt !== createdAt ? `<span>수정일 ${formatNoticeDate(updatedAt)}</span>` : '');
  // 본문은 관리자에서 sanitize된 HTML이 들어있음 (b, strong, br, p만 허용)
  bodyEl.innerHTML = sanitizeNoticeHtml(n.content || '');
}

/* HTML 화이트리스트 (관리자가 저장한 서식만 허용) */
function sanitizeNoticeHtml(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const allowed = new Set(['B','STRONG','BR','P','DIV']);
  const walk = (node) => {
    [...node.children].forEach(child => {
      walk(child);
      if(!allowed.has(child.tagName)){
        // 허용되지 않은 태그는 자식만 남기고 자기 자신 제거
        const parent = child.parentNode;
        while(child.firstChild) parent.insertBefore(child.firstChild, child);
        parent.removeChild(child);
      } else {
        // 속성 모두 제거
        [...child.attributes].forEach(attr => child.removeAttribute(attr.name));
      }
    });
  };
  walk(tmp);
  return tmp.innerHTML;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ── 토스트 (전역) ── */
function showToast(msg){
  let el = document.getElementById('ffpToast');
  if(!el){
    el = document.createElement('div');
    el.id='ffpToast';
    /* bottom 은 하단 앵커 광고 높이만큼 올린다(--ffp-anchor-h, app/header.py). */
    el.style.cssText='position:fixed;left:50%;bottom:calc(28px + var(--ffp-anchor-h, 0px));transform:translateX(-50%);background:var(--text-primary);color:var(--bg-card);font-size:13px;font-weight:700;padding:12px 18px;border-radius:12px;z-index:900;opacity:0;transition:opacity .25s ease;pointer-events:none;font-family:inherit';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  requestAnimationFrame(()=>{ el.style.opacity='1'; });
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.opacity='0'; }, 2400);
}


</script>
