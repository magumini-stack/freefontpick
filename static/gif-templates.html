<script>
/* ── 헤더 공통 ── */
function applyThemeIcons(){
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.hasAttribute('data-theme')
        && window.matchMedia('(prefers-color-scheme: dark)').matches);
  var mMoon=document.getElementById('mThemeIconMoon'),
      mSun=document.getElementById('mThemeIconSun'),
      mLabel=document.getElementById('mThemeLabel');
  if(mMoon) mMoon.style.display = isDark ? 'none' : '';
  if(mSun) mSun.style.display = isDark ? '' : 'none';
  if(mLabel) mLabel.textContent = isDark ? '주간모드' : '야간모드';
}
function toggleTheme(){
  var root=document.documentElement;
  var cur=root.getAttribute('data-theme')
    || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
  var next = cur==='dark' ? 'light':'dark';
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('ffp-theme', next); }catch(e){}
  applyThemeIcons();
}
function closeMobileNav(){
  var n=document.getElementById('mnav');
  if(n){ n.hidden=true; n.classList.remove('open'); }
}
function navFindFont(e){ /* 이 페이지에선 기본 링크 이동 */ }
applyThemeIcons();

/* ══════════════════════════════════════════════════════════════
   데이터
══════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
let TPLS = [], HUB_NAME = {};
let filt = {hub:'all'};
const dots = r => '●●●'.slice(0, r) || '—';
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* GIF 적합도 — DB의 gif_rating을 믿지 않고 실제 색에서 다시 뽑는다.
   저 컬럼에는 효과 프리셋 시절의 값이 남아 있어, 색 모델을 바꾼 지금은
   화면에 뜨는 점(●●●)과 실제 용량이 어긋난다. */
function ratingOf(t){
  const cfg = t.config || {};
  return FFPGif.inkRating(cfg.ink || FFPGif.inkFromEffectId(cfg.effect));
}

const animName = id => (FFPGif.ANIM_BY_ID[id] || {}).name || id;

/* 카드마다 렌더러 하나. 화면에 보이는 카드만 애니메이션을 돌린다 —
   48장을 동시에 그리면 노트북 팬이 돈다. */
const cards = new Map();   // number -> {renderer, tpl, visible, t, raf}
let io = null;

function filtered(){
  return TPLS.filter(t => filt.hub==='all' || t.hub_slug===filt.hub);
}

function render(){
  const list = filtered();
  /* 서버가 그려 둔 목록은 진짜 갤러리가 뜨면 감춘다. 둘 다 보이면 같은 목록이
     두 번 나온다 — index.html 의 #homeSsr 과 같은 방식이다. */
  const _ssr = document.getElementById('tplSsr');
  if(_ssr) _ssr.style.display = 'none';
  $('cnt').textContent = list.length;
  stopAll();
  const g = $('grid');
  if(!list.length){ g.innerHTML='<div class="empty">조건에 맞는 템플릿이 없어요</div>'; return; }
  g.innerHTML = list.map(t=>`
    <div class="card" data-n="${esc(t.number)}">
      <div class="cvwrap">
        <span class="ratiotag">${esc(t.ratio)}</span>
        <canvas data-cv="${esc(t.number)}"></canvas>
      </div>
      <div class="cbody">
        <div class="ctitle"><span class="cnum">${esc(t.number)}</span>
          <span class="cname">${esc(t.title || animName(t.anim))}</span></div>
        <div class="cmeta">
          <span class="pill">${esc(HUB_NAME[t.hub_slug] || t.hub_slug || '기타')}</span>
          <span class="dots${ratingOf(t)===3?' g':''}" title="GIF 적합도">${dots(ratingOf(t))}</span>
        </div>
        <div class="cact">
          <a class="btn" href="/gif?t=${encodeURIComponent(t.number)}">편집</a>
          <button class="btn btn-primary" data-dl="${esc(t.number)}">GIF 받기</button>
        </div>
      </div>
    </div>`).join('');

  list.forEach(setupCard);
  g.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>downloadTemplate(b.dataset.dl, b));
}

function stopAll(){
  cards.forEach(c=>{ if(c.raf) cancelAnimationFrame(c.raf); });
  cards.clear();
  if(io){ io.disconnect(); io = null; }
}

function setupCard(t){
  const cv = document.querySelector(`canvas[data-cv="${CSS.escape(t.number)}"]`);
  if(!cv) return;
  /* 카드 안에서만 보이므로 절반 해상도로 그린다.
     좌표 계산은 원본 크기 그대로라 내보낸 GIF와 같은 그림이 나온다. */
  const R = FFPGif.createRenderer(cv, null, {scale:0.5});
  R.applyConfig(t.config || {});

  const entry = {R, tpl:t, visible:false, t:Math.random(), raf:null, cv};
  cards.set(t.number, entry);

  /* 폰트를 등록하고 로드를 기다린 뒤에 그린다.
     기다리지 않으면 카드가 대체 폰트로 먼저 그려졌다가 튄다. */
  if(t.font){
    R.setState({fontStack: ffpEffectiveStack(t.font, t.font_weight)});
    ffpEnsureFontReady(t.font, t.font_weight, R.sizePx());
  }

  if(!io) io = new IntersectionObserver(onIntersect, {rootMargin:'120px'});
  io.observe(cv.closest('.card'));
}

function onIntersect(entries){
  entries.forEach(e=>{
    const n = e.target.dataset.n;
    const c = cards.get(n);
    if(!c) return;
    c.visible = e.isIntersecting;
    if(c.visible && !c.raf) tick(c);
    if(!c.visible && c.raf){ cancelAnimationFrame(c.raf); c.raf = null; }
  });
}

function tick(c){
  let last = performance.now();
  const step = now=>{
    if(!c.visible || c.busy){ c.raf = null; return; }
    const dt = (now-last)/1000; last = now;
    c.t = (c.t + dt/c.R.state.total) % 1;
    c.R.render(c.t);
    c.raf = requestAnimationFrame(step);
  };
  c.raf = requestAnimationFrame(step);
}

/* ══════════════════════════════════════════════════════════════
   바로 받기 — 카드의 렌더러를 원본 해상도로 되돌려 인코딩한다
══════════════════════════════════════════════════════════════ */
function ovlOpen(title, desc){
  $('ovlTitle').textContent = title;
  $('ovlDesc').textContent = desc;
  $('ovlBar').style.width = '0';
  $('ovlBarWrap').style.display = '';
  $('ovlImg').style.display = 'none';
  $('ovlBtns').style.display = 'none';
  $('ovl').classList.add('open');
}
function ovlClose(){ $('ovl').classList.remove('open'); }
$('ovlClose').onclick = ovlClose;

async function downloadTemplate(number, btn){
  const c = cards.get(number);
  if(!c || c.busy) return;
  const t = c.tpl;
  c.busy = true;
  if(c.raf){ cancelAnimationFrame(c.raf); c.raf = null; }
  btn.disabled = true;

  /* 카드 미리보기는 절반 크기다. 내보낼 때는 원본 해상도로 되돌린다. */
  const off = document.createElement('canvas');
  const R = FFPGif.createRenderer(off);
  R.applyConfig(t.config || {});

  try{
    ovlOpen(`${t.number} ${animName(t.anim)} — 준비 중`, '폰트를 불러오고 있어요.');
    if(t.font){
      R.setState({fontStack: ffpEffectiveStack(t.font, t.font_weight)});
      await ffpEnsureFontReady(t.font, t.font_weight, R.sizePx());
    }

    ovlOpen(`${t.number} ${animName(t.anim)} — GIF 만드는 중`, '프레임을 인코딩하고 있어요. 창을 닫지 마세요.');
    const blob = await FFPExport.exportGIF(R, (p, msg)=>{
      $('ovlBar').style.width = Math.round(p*100)+'%';
      $('ovlDesc').textContent = msg;
    });
    const filename = FFPExport.safeName(t.sample_text, 'gif');
    const kb = blob.size/1024;
    const sizeTxt = kb>=1024 ? (kb/1024).toFixed(2)+'MB' : Math.round(kb)+'KB';

    const result = await FFPExport.saveBlob(blob, filename, {
      onLongPress: url=>{
        $('ovlBarWrap').style.display = 'none';
        $('ovlImg').src = url;
        $('ovlImg').style.display = 'block';
        $('ovlTitle').textContent = '길게 눌러 저장해주세요';
        $('ovlDesc').textContent = '이 브라우저는 바로 저장을 지원하지 않아요. 위 이미지를 길게 누른 뒤 「사진에 저장」을 선택하세요.';
        $('ovlBtns').style.display = 'flex';
        $('ovlAction').onclick = ()=>FFPExport.downloadBlob(blob, filename);
      },
    });
    if(result !== 'longpress'){
      $('ovlTitle').textContent = '저장했어요';
      $('ovlDesc').textContent = `${filename} · ${sizeTxt}`;
      setTimeout(ovlClose, 1600);
    }
  }catch(err){
    $('ovlTitle').textContent = '만들지 못했어요';
    $('ovlDesc').textContent = (err && err.message) ? err.message : String(err);
    $('ovlBarWrap').style.display = 'none';
    $('ovlBtns').style.display = 'flex';
    $('ovlAction').style.display = 'none';
  }finally{
    c.busy = false;
    btn.disabled = false;
    if(c.visible) tick(c);
  }
}

/* ══════════════════════════════════════════════════════════════
   필터
══════════════════════════════════════════════════════════════ */
function bindChips(containerId, key, attr){
  $(containerId).onclick = e=>{
    const c = e.target.closest('.chip'); if(!c) return;
    [...$(containerId).children].forEach(x=>x.classList.toggle('on', x===c));
    filt[key] = c.dataset[attr];
    render();
  };
}

/* ══════════════════════════════════════════════════════════════
   시작
══════════════════════════════════════════════════════════════ */
async function boot(){
  const [tplRes, fontRes] = await Promise.all([
    fetch('/api/gif-templates').then(r=>r.json()).catch(()=>[]),
    fetch('/api/gif-fonts').then(r=>r.json()).catch(()=>({hubs:[]})),
  ]);
  TPLS = Array.isArray(tplRes) ? tplRes : [];
  ((fontRes && fontRes.hubs) || []).forEach(h=>{ HUB_NAME[h.slug] = h.title; });

  /* 용도 필터는 실제로 템플릿이 있는 허브만 보여준다 */
  const used = [...new Set(TPLS.map(t=>t.hub_slug).filter(Boolean))];
  $('hubF').innerHTML = '<button class="chip on" data-h="all">전체</button>'
    + used.map(s=>`<button class="chip" data-h="${esc(s)}">${esc(HUB_NAME[s]||s)}</button>`).join('');
  bindChips('hubF','hub','h');

  render();
}
boot();
</script>
