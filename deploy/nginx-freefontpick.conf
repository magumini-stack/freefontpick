# 폰트픽 — nginx 리버스 프록시
#
#   /etc/nginx/sites-available/freefontpick 로 두고
#   /etc/nginx/sites-enabled/ 에 심볼릭 링크를 건다.
#   YOUR_DOMAIN 세 군데를 실제 주소로 바꿔야 한다.
#
# ─────────────────────────────────────────────────────────────
#  이 파일에서 제일 중요한 두 줄
#
#      proxy_set_header Host              $host;
#      proxy_set_header X-Forwarded-Proto $scheme;
#
#  앱의 canonical_redirect 가 이 두 값으로 "방문자가 어떤 주소·어떤
#  프로토콜로 왔는지"를 판단한다.
#
#   · Host 를 안 넘기면 앱에는 127.0.0.1 로 보인다 →
#     www→루트 정리와 옛 주소(freefontpick.tdtd.io) 301 이 죽는다.
#   · X-Forwarded-Proto 가 http 로 넘어가면 앱이 "https 로 오세요" 하고
#     돌려보내고, 그 요청이 또 http 로 들어와 **무한 리다이렉트**가 된다.
#     카페24+Cloudflare 에서 겪었던 그 사고와 같은 구조다.
# ─────────────────────────────────────────────────────────────

upstream freefontpick {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ── http → https ────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # 인증서 발급·갱신용 경로만 http 로 남긴다
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── 본체 ────────────────────────────────────────────────────
server {
    # http2 를 이 자리에 쓰는 옛 문법을 일부러 쓴다.
    # `http2 on;` 은 nginx 1.25.1 이상에서만 된다 — 우분투 22.04(1.18)
    # 24.04(1.24) 둘 다 그보다 낮아서 그 문법이면 기동에 실패한다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 어드민이 올리는 ZIP 상한(앱은 50MB 까지 받는다). 여유를 둔다.
    client_max_body_size 60m;

    # 앱은 응답을 압축하지 않는다(운영에서 실측 — Content-Encoding 없음).
    # 여기서 한다. 홈이 62KB → 약 15KB 로 줄어 트래픽 한도에도 직접 듣는다.
    # woff2·png·zip 은 이미 압축돼 있어 목록에 넣지 않는다.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml
               application/json application/javascript
               application/xml application/rss+xml image/svg+xml;

    access_log /var/log/nginx/freefontpick.access.log;
    error_log  /var/log/nginx/freefontpick.error.log;

    # 폰트 ZIP 다운로드 — 큰 파일이라 버퍼에 담지 않고 흘려보낸다.
    # 앱도 FileResponse 로 스트리밍하는데, 여기서 버퍼링하면 nginx 가
    # 임시파일에 통째로 받아 쓴 뒤 내보내 디스크를 두 번 탄다.
    # (실측 — ZIP 79개 360MB, 큰 것은 한 개가 37MB)
    location ~ ^/api/(fonts/[0-9]+|wisefont/[^/]+)/download$ {
        proxy_pass http://freefontpick;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://freefontpick;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";

        # OG 이미지·GIF·웹폰트 서브셋을 처음 만들 때 몇 초 걸린다.
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
